# FundaCAD as a Flatpak, repackaged from the .deb the beta build produces
# (.github/workflows/build.yml, build-flatpak). The GNOME runtime carries
# WebKitGTK 4.1 and GTK 3, so this runs on systems where the AppImage cannot
# find them: NixOS, rpm-ostree, SteamOS and other read-only systems.
#
# The build copies the .deb to fundacad.deb next to this file first.
app-id: dev.fundacad.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: fundacad
finish-args:
  - --share=ipc
  # Native Wayland, and X11 only in a session that has no Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Game controllers through /dev/input (Flatpak 1.15.6 or newer) and a 3D mouse through spacenavd.
  # A 3D mouse over hidraw needs: flatpak override --user --device=all dev.fundacad.app
  - --device=input
  - --filesystem=/run/spnav.sock:ro
  # Plugin bundles are downloaded from the GitHub release.
  - --share=network
  # Assistants work in Documents/FundaCAD and ask through the file chooser
  # portal for any other path, as the app's own dialogs do.
  - --filesystem=xdg-documents/FundaCAD:create
modules:
  - name: fundacad
    buildsystem: simple
    sources:
      - type: file
        path: fundacad.deb
      - type: file
        path: dev.fundacad.app.desktop
      - type: file
        path: dev.fundacad.app.metainfo.xml
      - type: file
        path: ../dev.fundacad.app.mime.xml
      - type: file
        path: ../../src-tauri/icons/32x32.png
      - type: file
        path: ../../src-tauri/icons/128x128.png
      - type: file
        path: ../../src-tauri/icons/128x128@2x.png
      - type: file
        path: ../../src-tauri/icons/64x64.png
      - type: file
        path: ../../src-tauri/icons/icon.png
      - type: file
        path: ../../assets/brand/fundacad-mark.svg
    build-commands:
      - ar x fundacad.deb
      - tar -xf data.tar.* usr/bin/fundacad
      - install -Dm755 usr/bin/fundacad /app/bin/fundacad
      - install -Dm644 dev.fundacad.app.desktop /app/share/applications/dev.fundacad.app.desktop
      - install -Dm644 dev.fundacad.app.metainfo.xml /app/share/metainfo/dev.fundacad.app.metainfo.xml
      # Named after the app id, or flatpak does not export it to the host.
      - sed 's/name="fundacad"/name="dev.fundacad.app"/' dev.fundacad.app.mime.xml > mime.xml
      - install -Dm644 mime.xml /app/share/mime/packages/dev.fundacad.app.xml
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/dev.fundacad.app.png
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/dev.fundacad.app.png
      - install -Dm644 128x128@2x.png /app/share/icons/hicolor/256x256/apps/dev.fundacad.app.png
      - install -Dm644 64x64.png /app/share/icons/hicolor/64x64/apps/dev.fundacad.app.png
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/dev.fundacad.app.png
      - install -Dm644 fundacad-mark.svg /app/share/icons/hicolor/scalable/apps/dev.fundacad.app.svg
