# FundaCAD as a Flatpak, repackaged from the .deb the beta build produces
# (.github/workflows/build.yml, build-flatpak). The GNOME runtime carries
# WebKitGTK 4.1 and GTK 3, so this runs on systems where the AppImage cannot
# find them: NixOS, rpm-ostree, SteamOS and other read-only systems.
#
# The build copies the .deb to fundacad.deb next to this file first.
app-id: dev.fundacad.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: fundacad
finish-args:
  - --share=ipc
  # X11, as the AppImage does (GDK_BACKEND=x11 in its GTK hook): WebKitGTK
  # under Tauri crashes on the Wayland backend, tauri-apps/tauri#8541.
  - --socket=x11
  - --env=GDK_BACKEND=x11
  - --device=dri
  # A SpaceMouse is read over hidraw (src-tauri/src/spacemouse.rs), which only
  # --device=all exposes. The host still needs the udev rule from
  # packaging/99-spacemouse.rules for permission to open it.
  - --device=all
  # Plugin bundles are downloaded from the GitHub release.
  - --share=network
  # Documents live anywhere under home, and the MCP server opens paths it is
  # given, so the file chooser portal alone is not enough.
  - --filesystem=home
modules:
  - name: fundacad
    buildsystem: simple
    sources:
      - type: file
        path: fundacad.deb
      - type: file
        path: dev.fundacad.app.desktop
      - type: file
        path: dev.fundacad.app.metainfo.xml
      - type: file
        path: ../../src-tauri/icons/32x32.png
      - type: file
        path: ../../src-tauri/icons/128x128.png
      - type: file
        path: ../../src-tauri/icons/128x128@2x.png
    build-commands:
      - ar x fundacad.deb
      - tar -xf data.tar.* usr/bin/fundacad
      - install -Dm755 usr/bin/fundacad /app/bin/fundacad
      - install -Dm644 dev.fundacad.app.desktop /app/share/applications/dev.fundacad.app.desktop
      - install -Dm644 dev.fundacad.app.metainfo.xml /app/share/metainfo/dev.fundacad.app.metainfo.xml
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/dev.fundacad.app.png
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/dev.fundacad.app.png
      - install -Dm644 128x128@2x.png /app/share/icons/hicolor/256x256/apps/dev.fundacad.app.png
