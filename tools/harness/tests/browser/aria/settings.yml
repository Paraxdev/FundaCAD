- dialog "Preferences":
  - heading "Preferences" [level=2]
  - button "Close"
  - tablist "Preference categories":
    - tab "Appearance" [selected]
    - tab "Viewport"
    - tab "Navigation"
    - tab "Accessibility"
  - tabpanel "Appearance":
    - heading "Appearance" [level=3]
    - combobox "Theme"
