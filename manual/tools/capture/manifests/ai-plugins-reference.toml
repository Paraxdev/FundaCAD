[[shot]]
file = "manual/docs/img/texture-knurl.png"
size = [1000, 840]
viewport = [1500, 900]
theme = "fundacad"
crop = "region"
at = [500, 40]
park = [1300, 860]
steps = [
  { open = "new" },
  { evaluate = '() => { const s = window.store; s.addFeature({ id: "cy", type: "cylinder", radius: 15, height: 20 }); s.addFeature({ id: "tx", type: "texture", body: "body1", kind: "knurl", depth: 0.4, scale: 2 }); }' },
  { wait = 4000 },
  { view = "iso" },
  { evaluate = '() => { document.elementFromPoint(800, 485).dispatchEvent(new WheelEvent("wheel", { deltaY: -200, clientX: 800, clientY: 485, bubbles: true, cancelable: true })); }' },
  { wait = 800 },
  { panel = "history" },
  { click_css = '.timeline-node[data-id="tx"]' },
  { wait = 1500 },
]
show = "A cylinder with a knurled surface and the Texture step open in the History card, Pattern Knurl, Depth 0.4 and Scale 2 mm. The view is zoomed in one wheel step."
alt = "A cylinder with a knurled surface and the Texture step's settings in the History card"
uses = ["manual/docs/plugins/texture.md"]

