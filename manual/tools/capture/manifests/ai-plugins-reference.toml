# Pictures of the AI, Plugins and Reference pages. An entry with stub = true still needs its steps and crop,
# its show line says what the picture must show.

[[shot]]
file = "manual/docs/img/ai-live-document.png"
size = [980, 360]
theme = "fundacad"
crop = "region"
at = [228, 88]
park = [1300, 860]
steps = [
  { open = "new" },
  { panel = "preferences" },
  { click_css = '.prefs-nav-btn[data-category="mcp"]' },
  { click_css = "#prefs-live" },
  { wait = 300 },
]
show = "Preferences, AI assistants page, the Live document setting with its three choices open. Check the labels in src."
alt = "The Live document choices open in Preferences, AI assistants"
uses = ["manual/docs/ai/sharing.md"]

[[shot]]
file = "manual/docs/img/parameter-setup.png"
size = [1074, 518]
theme = "fundacad"
crop = "panel"
target = ".xp-setup-panel"
pad = 8
park = [1300, 860]
steps = [
  { open = "new" },
  { param = "width", value = "40" },
  { param = "gap", value = "0.4" },
  { param = "solidCore", value = "1" },
  { evaluate = '''() => { const s = window.store; s.updateParamExtras((x) => { x.groups = [{ id: "g1", name: "Fit" }]; x.checks = [{ id: "c1", expr: "gap >= 0.3", message: "gap below 0.3 mm fuses", level: "warning" }]; x.configurations = [{ id: "k1", name: "Small", values: { width: "30", gap: "0.4", solidCore: "1" } }]; }); s.setParamMeta("width", { control: { kind: "slider", min: 20, max: 80, step: 5 } }); s.setParamMeta("gap", { control: { kind: "number", min: 0.1, max: 1 }, group: "g1" }); s.setParamMeta("solidCore", { control: { kind: "toggle" } }); }''' },
  { wait = 300 },
  { menu = "Edit/Parameter Setup…" },
  { wait = 400 },
]
show = "The Parameter Setup dialog with its Controls, Groups, Configurations and Checks."
alt = "Parameter Setup dialog with Controls, Groups, Configurations and Checks"
uses = ["manual/docs/plugins/extra-parameters.md"]

[[shot]]
file = "manual/docs/img/prefs-gamepad.png"
size = [972, 692]
theme = "fundacad"
crop = "panel"
target = ".modal-panel.prefs-panel"
pad = 6
park = [1300, 860]
steps = [
  { open = "new" },
  { evaluate = "() => import('/src/plugins/host.ts').then((m) => m.openPluginSettings('FundaCAD.Gamepad'))" },
  { wait = 500 },
  { evaluate = '''() => { let e = document.querySelector('[data-plugin-row="FundaCAD.Gamepad"]'); while (e && !(e.scrollHeight > e.clientHeight && getComputedStyle(e).overflowY !== 'visible')) e = e.parentElement; if (e) e.scrollTop -= 14; }''' },
  { wait = 200 },
]
show = "Preferences, Plugins, the Game controller row with its settings open."
alt = "The Game controller row in Preferences, Plugins, with its settings open"
uses = ["manual/docs/plugins/gamepad.md"]

