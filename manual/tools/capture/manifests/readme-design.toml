# Pictures of the README and design guide. An entry with stub = true still needs its steps and crop,
# its show line says what the picture must show.

[[shot]]
file = "assets/readme/ui-overview.png"
size = [1600, 1000]
theme = "fundacad"
crop = "window"
park = [1450, 960]
pause = 1600
steps = [
  { open = "fixture:readme-gearbox.json", name = "Planetary gearbox.funda" },
  { wait = 1500 },
  { panel = "items" },
  { panel = "history" },
  { press = "Escape" },
  { evaluate = "() => document.documentElement.classList.remove('no-glass-blur')" },
  { evaluate = "() => { document.activeElement?.blur(); const el = document.elementFromPoint(845, 600); el.dispatchEvent(new WheelEvent('wheel', { deltaY: -300, clientX: 845, clientY: 600, bubbles: true, cancelable: true })); }" },
  { wait = 800 },
]
show = "The whole window at 1600x1000 with an exploded planetary gearbox, the Items card, the tool rail and the History card. Same file as the manual copy of ui-overview.png. Also a Flathub screenshot."
alt = "FundaCAD main window with an exploded planetary gearbox, the Items card, the tool rail and the History"
uses = ["README.md:19"]

