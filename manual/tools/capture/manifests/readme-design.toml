[[shot]]
file = "docs/design/context-menu-dark.png"
size = [1200, 736]
theme = "fundacad"
crop = "window"
pause = 1200
steps = [
  { open = "example:Wall bracket" },
  { wait = 1200 },
  { panel = "items" },
  { press = "Escape" },
  { mouse = "down", at = [640, 620], button = "middle" },
  { mouse = "move", by = [-150, 0], steps = 12 },
  { mouse = "up", button = "middle" },
  { evaluate = "() => { document.activeElement?.blur(); document.documentElement.classList.remove('no-glass-blur'); }" },
  { mouse = "down", at = [625, 300], button = "right" },
  { mouse = "up", button = "right" },
  { wait = 600 },
]
show = "A context menu open in the workspace and the selection state of the shell, FundaCAD Noir."
alt = "A context menu and the selection state of the shell"
uses = ["docs/DESIGN.md:950"]

