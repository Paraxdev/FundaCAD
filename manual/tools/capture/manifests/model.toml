# Pictures of the Model pages. An entry with stub = true still needs its steps and crop,
# its show line says what the picture must show.

[[shot]]
file = "manual/docs/img/combine-subtract.png"
size = [660, 620]
theme = "fundacad"
crop = "region"
park = [1300, 860]
pause = 1600
steps = [
  { open = "fixture:sketch-block.json" },
  { panel = "items", open = false },
  { panel = "history" },
  { tool = "Primitive" },
  { click = "Cylinder" },
  { wait = 600 },
  { evaluate = "() => [...document.querySelectorAll('.timeline-node')].at(-1).click()" },
  { wait = 400 },
  { type = ["prop:radius", "10"], enter = true },
  { type = ["prop:height", "40"], enter = true },
  { evaluate = "() => document.activeElement && document.activeElement.blur()" },
  { panel = "history", open = false },
  { tool = "Subtract" },
  { click_at = true, world = [25, 15, 10] },
  { click_at = true, world = [0, 0, 20] },
  { wait = 800 },
  { press = "Escape" },
]
show = "A block with a round hole left where a cylinder was subtracted."
alt = "A block with a round hole where a cylinder was subtracted"
uses = ["manual/docs/model/combine.md"]

