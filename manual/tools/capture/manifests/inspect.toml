[[shot]]
file = "manual/docs/img/stress-results.png"
size = [900, 740]
viewport = [1920, 1080]
theme = "fundacad"
crop = "region"
at = [650, 165]
park = [1900, 1060]
steps = [
  { open = "example:Wall bracket" },
  { evaluate = "() => { const r = window.viewport.rig; r.zoomBy(1.5); r.panScreen(0.1, -0.15); window.viewport.requestRender(); }" },
  { wait = 700 },
  { tool = "Stress" },
  { wait = 600 },
  { click_css = ".stress-run" },
  { evaluate = "() => new Promise((res) => { const t = setInterval(() => { if (document.querySelector('.stress-legend')) { clearInterval(t); res(); } }, 250); })" },
  { wait = 1500 },
  { evaluate = "() => document.querySelectorAll('.toast-close').forEach((b) => b.click())" },
  { wait = 500 },
]
show = "The Stress panel on its Results tab listing peak stress, deflection and safety factor beside the coloured bracket (Set up and Results tabs are recent)."
alt = "The Stress panel listing peak stress, deflection and safety factor beside the coloured bracket"
uses = ["manual/docs/inspect/stress-results.md:5"]

