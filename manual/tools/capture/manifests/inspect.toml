# Pictures of the Inspect pages. An entry with stub = true still needs its steps and crop,
# its show line says what the picture must show.

[[shot]]
file = "manual/docs/img/bed-fit-result.png"
size = [640, 700]
theme = "fundacad"
crop = "region"
at = [434, 189]
park = [1400, 880]
steps = [
  { open = "example:Wall bracket" },
  { evaluate = "() => { const r = window.viewport.rig; r.zoomBy(0.93); r.panScreen(0.06, -0.16); window.viewport.requestRender(); }" },
  { wait = 700 },
  { tool = "Bed Fit Check" },
  { wait = 400 },
  { evaluate = "() => [...document.querySelectorAll('.ui-confirm-choice')].find((b) => b.textContent.trim().startsWith('220 x 220 x 250')).click()" },
  { wait = 500 },
]
show = "A bracket with the Bed Fit Check result saying it fits a 220 by 220 by 250 mm bed (Print group)."
alt = "A bracket with a message that it fits the 220 by 220 by 250 mm bed"
uses = ["manual/docs/inspect/bed-fit.md:5"]

[[shot]]
file = "manual/docs/img/interference-list.png"
size = [750, 640]
viewport = [1920, 1080]
theme = "fundacad"
crop = "region"
at = [810, 170]
park = [1900, 1060]
steps = [
  { open = "fixture:box-cylinder.json" },
  { evaluate = "() => { const r = window.viewport.rig; r.zoomBy(1.45); r.panScreen(-0.355, 0.18); window.viewport.requestRender(); }" },
  { wait = 700 },
  { tool = "Interference" },
  { wait = 1500 },
  { evaluate = "() => document.querySelectorAll('.toast-close').forEach((b) => b.click())" },
  # The overlap is inside the box, X sees through the parts so it shows. It stays on across entries, so it goes off after.
  { press = "x" },
  { evaluate = "() => { setTimeout(() => window.viewport.setXray(false), 4000); }" },
  { wait = 500 },
]
show = "The Interference panel naming one clash between a box and a cylinder, the overlap drawn red inside the see through parts."
alt = "Interference panel naming one clash between a box and a cylinder, with the overlap drawn in red"
uses = ["manual/docs/inspect/interference.md:5"]

[[shot]]
file = "manual/docs/img/measure-two-holes.png"
size = [790, 640]
viewport = [1920, 1080]
theme = "fundacad"
crop = "region"
at = [770, 170]
park = [1900, 1060]
steps = [
  { open = "example:Plate" },
  { evaluate = "() => { const r = window.viewport.rig; r.zoomBy(1.2); r.panScreen(-0.318, 0.107); window.viewport.requestRender(); }" },
  { wait = 700 },
  { tool = "Measure" },
  # Straight edges, as a hole's rim has no direction and reads 90 degrees to anything.
  { click = "edge:near=0,25,6" },
  { click = "edge:near=40,-25,3" },
  { wait = 500 },
]
show = "The Measure panel showing the distance, centers and a 90 degree angle between the plate's back edge and a corner edge."
alt = "Measure panel showing the distance, centers and angle between two edges of a plate"
uses = ["manual/docs/inspect/measure.md:5"]

[[shot]]
file = "manual/docs/img/overhang-red.png"
size = [850, 440]
viewport = [1920, 1080]
theme = "fundacad"
crop = "region"
at = [705, 171]
park = [1900, 1060]
steps = [
  { open = "fixture:tee.json" },
  { evaluate = "() => { const v = window.viewport; const b = v.model.box; v.rig.setViewDir(b.min.clone().set(0.45, -1.3, -0.6), b.min.clone().set(0, 0, 1)); v.requestRender(); }" },
  { wait = 900 },
  { evaluate = "() => { const r = window.viewport.rig; r.zoomBy(1.8); r.panScreen(-0.04, 0.3); window.viewport.requestRender(); }" },
  { wait = 700 },
  { tool = "Overhang" },
  { wait = 600 },
  # Seen from below the bed, the grid lies over the undersides, so it is off for this picture and back on after.
  { evaluate = "() => import('/src/ui/viewMode.ts').then((m) => { m.setOverlay('grid', false); setTimeout(() => m.setOverlay('grid', true), 5000); })" },
  { wait = 300 },
]
show = "Undersides of a T shaped part painted red beside the Overhang analysis panel."
alt = "Undersides of a T shaped part painted red beside the Overhang analysis panel"
uses = ["manual/docs/inspect/overhang.md:5"]

[[shot]]
file = "manual/docs/img/printability-panel.png"
size = [426, 575]
theme = "fundacad"
crop = "panel"
target = ".printability-panel"
fit = "size"
park = [1400, 880]
steps = [
  { open = "example:Capsule holder" },
  { tool = "Printability" },
  { click_css = ".printability-run" },
  { wait = 1500 },
  { evaluate = "() => document.querySelectorAll('.toast-close').forEach((b) => b.click())" },
  # Number boxes show the PC's decimal comma whatever the browser is told, as text they read 0.4 as in the page.
  { evaluate = "() => document.querySelectorAll('.printability-panel input[type=number]').forEach((i) => { i.type = 'text'; })" },
  { wait = 800 },
]
show = "The Printability panel with its settings and two findings."
alt = "The Printability panel with its settings and two findings"
uses = ["manual/docs/inspect/printability.md:5"]

