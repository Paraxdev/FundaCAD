[[shot]]
file = "manual/docs/img/insert-document.png"
size = [460, 200]
theme = "fundacad"
crop = "region"
around = ".ui-confirm"
park = [1400, 860]
# Insert Document reads the file through the desktop app, so the page asks the same question the app asks after the pick.
steps = [
  { open = "example:Plate" },
  { evaluate = '''async () => {
    const { choose } = await import('/src/ui/choice.ts');
    choose('Insert wall bracket.funda', [
      { value: 'append', label: 'Append', hint: 'copy it in once' },
      { value: 'link', label: 'Link', hint: 'update when the file changes' },
    ]);
  }''' },
  { wait = 300 },
]
show = "The Insert Document question with Append and Link, each with its hint."
alt = "Insert Document asking Append or Link"
uses = ["manual/docs/files/link.md:5"]

[[shot]]
file = "manual/docs/img/import-step.png"
