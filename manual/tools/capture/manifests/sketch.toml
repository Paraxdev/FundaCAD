# Pictures of the Sketch pages. An entry with stub = true still needs its steps and crop,
# its show line says what the picture must show.

[[shot]]
file = "manual/docs/img/sketch-constraints.png"
size = [860, 600]
theme = "fundacad"
crop = "region"
at = [580, 62]
park = [300, 860]
steps = [
  { open = "fixture:sketch-plate.json", name = "Plate.funda" },
  { click = "feature:s", double = true },
  { evaluate = "() => window.viewport.frameAround([4, -5, 0], 115)" },
  { wait = 900 },
]
show = "A dimensioned rectangle and the Relations list in the sketch palette."
alt = "A dimensioned rectangle and the Relations list in the sketch palette"
uses = ["manual/docs/sketch/constraints.md:5"]

[[shot]]
file = "manual/docs/img/sketch-loose-ends.png"
size = [520, 300]
theme = "fundacad"
crop = "region"
around = "sketch:31,10"
park = [300, 860]
steps = [
  { open = "fixture:sketch-loose.json", name = "Outline.funda" },
