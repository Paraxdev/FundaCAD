# Pictures of the Sketch pages. An entry with stub = true still needs its steps and crop,
# its show line says what the picture must show.

[[shot]]
file = "manual/docs/img/sketch-constraints.png"
size = [860, 600]
theme = "fundacad"
crop = "region"
at = [580, 62]
park = [300, 860]
steps = [
  { open = "fixture:sketch-plate.json", name = "Plate.funda" },
  { click = "feature:s", double = true },
  { evaluate = "() => window.viewport.frameAround([4, -5, 0], 115)" },
  { wait = 900 },
]
show = "A dimensioned rectangle and the Relations list in the sketch palette."
alt = "A dimensioned rectangle and the Relations list in the sketch palette"
uses = ["manual/docs/sketch/constraints.md:5"]

[[shot]]
file = "manual/docs/img/sketch-loose-ends.png"
size = [520, 300]
theme = "fundacad"
crop = "region"
around = "sketch:31,10"
park = [300, 860]
steps = [
  { open = "fixture:sketch-loose.json", name = "Outline.funda" },
  { click = "feature:s", double = true },
  { evaluate = "() => window.viewport.frameAround([31, 10, 0], 130)" },
  { wait = 900 },
]
show = "Amber dots on the corners of an outline drawn without snapping, and red dots on a line whose ends touch nothing."
alt = "Amber dots on the corners of an outline drawn without snapping, and red dots on a line whose ends touch nothing"
uses = ["manual/docs/sketch/constraints.md:17"]

[[shot]]
file = "manual/docs/img/sketch-dimension.png"
size = [640, 260]
theme = "fundacad"
crop = "region"
around = "sketch:15,13.5"
park = [1000, 760]
steps = [
  { open = "fixture:sketch-dim.json", name = "Plate.funda" },
  { click = "feature:s", double = true },
  { evaluate = "() => window.viewport.frameAround([6, 13, 0], 130)" },
  { wait = 900 },
  { tool = "Dimension" },
  { click_at = true, sketch = [20.3, 19.7] },
  { hover = [20, 23], space = "sketch" },
  { click_at = true, sketch = [20, 23] },
  { wait = 400 },
]
show = "The Dimension tool on a rectangle edge with its value box."
alt = "The Dimension tool on a rectangle edge with its value box"
uses = ["manual/docs/sketch/dimensions.md:5"]

[[shot]]
file = "manual/docs/img/sketch-typed-size.png"
size = [640, 260]
theme = "fundacad"
crop = "region"
around = "sketch:30,10"
offset = [60, 0]
steps = [
  { open = "new" },
  { press = "s" },
  { pick_plane = "XY" },
  { evaluate = "() => window.viewport.frameAround([30, 10, 0], 130)" },
  { wait = 900 },
  { tool = "Rectangle" },
  { click_at = true, sketch = [0, 0] },
  { hover = [33, 20], space = "sketch" },
  { press = ["4", "0"] },
  { hover = [42, 20], space = "sketch" },
  { wait = 400 },
]
show = "A rectangle being drawn with 40 typed into the width box."
alt = "A rectangle being drawn with 40 typed into the width box"
uses = ["manual/docs/sketch/exact-sizes.md:5"]

[[shot]]
file = "manual/docs/img/sketch-pattern.png"
size = [520, 440]
theme = "fundacad"
crop = "region"
around = "sketch:12,0"
steps = [
  { open = "new" },
  { press = "s" },
  { pick_plane = "XY" },
  { evaluate = "() => window.viewport.frameAround([12, 0, 0], 130)" },
  { wait = 900 },
  { tool = "Bolt Circle" },
  { click_at = true, sketch = [0, 0] },
  { hover = [14.14, 14.14], space = "sketch" },
  { wait = 400 },
]
show = "A bolt circle of six holes with the count and diameter boxes."
alt = "A bolt circle of six holes with the count and diameter boxes"
uses = ["manual/docs/sketch/hole-patterns.md:5"]

[[shot]]
file = "manual/docs/img/sketch-palette.png"
size = [290, 620]
theme = "fundacad"
crop = "panel"
target = "#palette"
fit = "size"
park = [300, 860]
steps = [
  { open = "fixture:sketch-plate.json", name = "Plate.funda" },
  { click = "feature:s", double = true },
  { wait = 600 },
]
show = "The sketch palette with Snap, Construction and the other options."
alt = "The sketch palette with Snap, Construction and the other options"
uses = ["manual/docs/sketch/snapping.md:5"]

[[shot]]
file = "manual/docs/img/sketch-overview.png"
size = [1440, 900]
theme = "fundacad"
crop = "window"
steps = [
  { open = "fixture:sketch-block.json", name = "Block.funda" },
  { pick_face = "top" },
  { press = "s" },
  { tool = "Rectangle" },
  { hover = "#toolrail" },
]
show = "An open sketch on the top face of a block, with the tool rail and the sketch palette."
alt = "An open sketch on a block's top face, with the tool rail and the sketch palette"
uses = ["manual/docs/sketch/start.md:5"]

# Last: it turns Show Dimensions and Show Constraints off, and the palette keeps them for the rest of the session.
[[shot]]
file = "manual/docs/img/sketch-gear-profile.png"
size = [1600, 1000]
theme = "fundacad"
crop = "window"
steps = [
  { open = "fixture:sketch-gear.json", name = "Gear.funda" },
  { click = "feature:s", double = true },
  { click = "Show Dimensions" },
  { click = "Show Constraints" },
  { evaluate = "() => window.viewport.frameAround([0, 0, 0], 120)" },
  { wait = 900 },
  { tool = "Circle" },
  { hover = [0, 0], space = "sketch" },
]
show = "A gear profile drawn in a sketch, the sketch rail and the hint line at the bottom of the view, 1600x1000. Also copied to assets/readme for Flathub."
alt = "A gear profile drawn in a sketch"
uses = ["manual/docs/sketch/shapes.md:5"]
