  { hover = [33, 20], space = "sketch" },
  { press = ["4", "0"] },
  { hover = [42, 20], space = "sketch" },
  { wait = 400 },
]
show = "A rectangle being drawn with 40 typed into the width box."
alt = "A rectangle being drawn with 40 typed into the width box"
uses = ["manual/docs/sketch/exact-sizes.md:5"]

