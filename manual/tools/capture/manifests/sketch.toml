[[shot]]
file = "manual/docs/img/sketch-dimension.png"
size = [640, 260]
theme = "fundacad"
crop = "region"
around = "sketch:15,13.5"
park = [1000, 760]
steps = [
  { open = "fixture:sketch-dim.json", name = "Bar.funda" },
  { click = "feature:s", double = true },
  { evaluate = "() => window.viewport.frameAround([6, 13, 0], 130)" },
  { wait = 900 },
  { tool = "Dimension" },
  { click_at = true, sketch = [16, 10] },
  { click_at = true, sketch = [0, 15] },
  { hover = [6, 4], space = "sketch" },
  { click_at = true, sketch = [6, 4] },
  { wait = 400 },
]
show = "The Dimension tool placing the distance from a hole to the edge of a rectangle, with its value box."
alt = "The Dimension tool placing the distance from a hole to a rectangle's edge, with its value box"
uses = ["manual/docs/sketch/dimensions.md:7"]

[[shot]]
file = "manual/docs/img/sketch-typed-size.png"
