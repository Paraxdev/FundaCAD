[project]
site_name = "FundaCAD"
site_url = "https://fundacad.dev/"
site_description = "FundaCAD is free, open source parametric CAD for 3D printing on Windows, macOS and Linux. This manual covers installing it, sketching, modelling and exporting for your slicer."
docs_dir = "docs"
repo_url = "https://github.com/Paraxdev/fundacad"
repo_name = "Paraxdev/fundacad"
extra_css = ["stylesheets/lists.css", "stylesheets/motion.css", "stylesheets/banner.css", "stylesheets/site.css"]
extra_javascript = ["javascripts/motion.js"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = ["start/install.md", "start/first-part.md", "start/examples.md", "start/report.md"] },
  { "Sketching" = [
    { "Basics" = ["sketch/start.md", "sketch/shapes.md", "sketch/exact-sizes.md", "sketch/keyboard.md", "sketch/snapping.md", "sketch/edit.md", "sketch/project.md", "sketch/reference-image.md"] },
    { "Rules" = ["sketch/constraints.md", "sketch/dimensions.md"] },
    { "Repeating" = ["sketch/patterns.md", "sketch/hole-patterns.md"] },
  ] },
  { "Modelling" = [
    { "Create" = ["model/extrude.md", "model/primitives.md", "model/revolve.md", "model/loft-sweep.md"] },
    { "Modify" = [
      "model/press-pull.md",
      "model/fillet-chamfer.md",
      "model/hole.md",
      "model/move.md",
      "model/scale-mirror.md",
      "model/pattern.md",
      "model/combine.md",
      "model/split.md",
      "model/shell.md",
      "model/offset-face.md",
      "model/draft.md",
      "model/joint.md",
    ] },
    { "Construct" = ["model/construct.md"] },
    { "Organise" = ["model/items.md", "model/picking.md"] },
    { "History" = ["model/timeline.md", "model/suppress.md"] },
    { "Parameters" = ["model/parameters.md", "model/expressions.md"] },
  ] },
  { "Inspect" = [
    { "Look" = ["inspect/measure.md", "inspect/section.md", "inspect/properties.md", "inspect/interference.md"] },
    { "Print checks" = ["inspect/overhang.md", "inspect/printability.md", "inspect/bed-fit.md"] },
    { "Stress" = ["inspect/stress.md", "inspect/stress-results.md"] },
  ] },
  { "Render" = ["render/materials.md", "render/editing.md", "render/graph.md", "render/environment.md", "render/view-modes.md"] },
  { "Files" = ["files/home.md", "files/save.md", "files/versions.md", "files/link.md", "files/import.md", "files/export.md"] },
  { "Plugins" = [
    "plugins/index.md",
    "plugins/extra-parameters.md",
    "plugins/screws.md",
    "plugins/texture.md",
    "plugins/organic.md",
    "plugins/print-toolbox.md",
    "plugins/printing.md",
    "plugins/multicolor.md",
    "plugins/gamepad.md",
    "plugins/spacemouse.md",
  ] },
  { "AI assistants" = ["ai/connect.md", "ai/sharing.md", "ai/guide.md", "ai/without-sight.md"] },
  { "Reference" = ["reference/shortcuts.md", "reference/preferences.md", "reference/accessibility.md", "reference/glossary.md"] },
]

[project.theme]
custom_dir = "overrides"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "content.tooltips",
]

# The theme keeps the light or dark choice under this path, so the root shares one choice across /beta/ and /dev/.
[project.extra]
scope = "/"

# The site starts dark on every system (overrides/main.html), and the toggle steps light, the system's setting, then
# back to dark. The theme needs the light and dark media names to resolve the system entry.
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Follow the system setting"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
"pymdownx.details" = {}
"pymdownx.snippets" = { auto_append = ["includes/glossary.md"] }
"pymdownx.superfences" = {}
"pymdownx.blocks.caption" = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
