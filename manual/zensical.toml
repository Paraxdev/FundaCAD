[project]
site_name = "FundaCAD"
site_url = "https://paraxdev.github.io/FundaCAD/"
site_description = "The FundaCAD user manual"
docs_dir = "docs"
repo_url = "https://github.com/Paraxdev/fundacad"
repo_name = "Paraxdev/fundacad"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = ["start/install.md", "start/first-part.md"] },
  { "Sketching" = [
    { "Basics" = ["sketch/start.md", "sketch/shapes.md", "sketch/exact-sizes.md", "sketch/snapping.md", "sketch/edit.md", "sketch/project.md"] },
    { "Rules" = ["sketch/constraints.md", "sketch/dimensions.md"] },
    { "Repeating" = ["sketch/patterns.md", "sketch/hole-patterns.md"] },
  ] },
  { "Modelling" = [
    { "Create" = ["model/extrude.md", "model/primitives.md", "model/revolve.md", "model/loft-sweep.md"] },
    { "Modify" = [
      "model/press-pull.md",
      "model/fillet-chamfer.md",
      "model/hole.md",
      "model/move.md",
      "model/scale-mirror.md",
      "model/pattern.md",
      "model/combine.md",
      "model/split.md",
      "model/shell.md",
      "model/offset-face.md",
      "model/draft.md",
      "model/joint.md",
    ] },
    { "Construct" = ["model/construct.md"] },
    { "Organise" = ["model/items.md", "model/picking.md"] },
    { "History" = ["model/timeline.md", "model/suppress.md"] },
    { "Parameters" = ["model/parameters.md", "model/expressions.md"] },
  ] },
  { "Inspect" = [
    { "Look" = ["inspect/measure.md", "inspect/section.md", "inspect/properties.md", "inspect/interference.md"] },
    { "Print checks" = ["inspect/overhang.md", "inspect/printability.md", "inspect/bed-fit.md"] },
    { "Stress" = ["inspect/stress.md", "inspect/stress-results.md"] },
  ] },
  { "Render" = ["render/materials.md", "render/editing.md", "render/graph.md", "render/environment.md", "render/view-modes.md"] },
  { "Files" = ["files/save.md", "files/versions.md", "files/link.md", "files/import.md", "files/export.md"] },
  { "Plugins" = [
    "plugins/index.md",
    "plugins/extra-parameters.md",
    "plugins/screws.md",
    "plugins/texture.md",
    "plugins/organic.md",
    "plugins/print-toolbox.md",
    "plugins/printing.md",
    "plugins/multicolor.md",
    "plugins/gamepad.md",
    "plugins/spacemouse.md",
  ] },
  { "AI assistants" = ["ai/connect.md", "ai/sharing.md"] },
  { "Reference" = ["reference/shortcuts.md", "reference/preferences.md", "reference/glossary.md"] },
]

[project.theme]
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "content.tooltips",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
"pymdownx.details" = {}
"pymdownx.snippets" = { auto_append = ["includes/glossary.md"] }
"pymdownx.superfences" = {}
"pymdownx.blocks.caption" = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
