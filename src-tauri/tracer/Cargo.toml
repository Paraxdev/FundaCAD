[package]
name = "fundacad-tracer"
version = "0.1.0"
description = "Native progressive path tracer for the viewport's Trace mode"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

# No Tauri here, so the mapping, scene and image tests build in seconds. wgpu is
# pinned with the app's lock edge (see src-tauri/Cargo.toml).
[dependencies]
wgpu = "=30.0.1"
futures-executor = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Open Image Denoise is loaded at runtime from a checked download (src/oidn.rs).
libloading = "0.8"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
png = "0.17"
# The binding and layout tests read the kernels as wgpu compiles them.
naga = { version = "=30.0.1", features = ["wgsl-in"] }
# tracer_serve: the frames transport and the engine's token gate, no Tauri.
fundacad-frames = { path = "../frames" }
fundacad-engine = { path = "../../crates/fundacad-engine", features = ["ws"] }
tungstenite = "0.29"

# A test target too, so the crate's cargo test covers the command socket.
[[example]]
name = "tracer_serve"
test = true
