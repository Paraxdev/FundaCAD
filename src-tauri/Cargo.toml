[package]
name = "fundacad"
version = "0.2.0"
description = "FundaCAD, a parametric CAD app driving build123d"
authors = ["Paraxdev"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-only"

[lib]
name = "fundacad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# system-browser opener for the handful of outbound links (docs, the tracker).
tauri-plugin-opener = "2"
# One app instance only. Two instances each spawn a sidecar, and the second one
# cannot bind 127.0.0.1:8765, so it dies and the user is told the geometry engine
# crashed (field report 2c0cd78a, 0.1.84 on Windows).
tauri-plugin-single-instance = "2"
libc = "0.2"
hidapi = "2"
# portable CSPRNG for the sidecar WebSocket token (replaces a /dev/urandom read that
# fell back to a weak token on Windows).
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP client for two callers. plugins/mod.rs fetches plugin bundles from any
# HTTPS host, and the transport is where the authenticity of a download comes
# from. plugins/localnet.rs sends a plugin's requests to devices on the local
# network, with a file part in a form. rustls, not native-tls, so no system
# OpenSSL joins the build.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots"] }
# Bundle integrity for downloaded plugins (plugins.rs). sha256 rather than the
# blake2 the document format uses because the release job computes it with `sha256sum` and a
# digest nobody can reproduce from a shell is a digest nobody checks.
sha2 = "0.10"
# Binary payloads cross Tauri IPC as base64 strings (a JSON Vec<u8> would be
# pathological at ~1 MB); the plugin commands use this.
base64 = "0.22"
# --- Rust engine (docs/RUST-PIVOT.md) ----------------------------------------
# The worker loop and the geometry crate link OpenCASCADE statically, a long
# C++ build, so they are opt-in until the Rust engine replaces the sidecar.
# `cargo build --features rust-engine`.
fundacad-protocol = { path = "../crates/fundacad-protocol", optional = true }
fundacad-engine = { path = "../crates/fundacad-engine", optional = true }
fundacad-geom = { path = "../crates/fundacad-geom", optional = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The document files (.fundab, the ZIP container, the JSON .funda) live in the
# fundacad-format crate, shared with the engine and the CLI. Rust owns them, NOT
# the sidecar, because sidecar.rs deliberately does not auto-respawn, and a save
# that needed it would leave the user unable to save at all. No OCCT in it.
fundacad-format = { path = "../crates/fundacad-format" }
# Plugin bundles are ZIPs (plugins/bundle.rs).
#
# `deflate-flate2`, NOT the `deflate` umbrella: that one also pulls
# `deflate-zopfli`, a much slower alternative compressor we have no use for and
# which would otherwise land in the DEFAULT build.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# flate2 is named EXPLICITLY, with its default `rust_backend`, and must stay that
# way. zip's `deflate-flate2` turns on the flate2 dependency but does NOT select
# a compression backend, so flate2 needs someone to enable one. This used to be
# left to tauri-plugin-updater, which pulls flate2 for its tar.gz path, true on
# Linux and macOS, FALSE on Windows, where the updater ships .exe/.msi and never
# touches tar.gz. The Windows build therefore got a backend-less flate2 and died
# with "No compression backend selected" plus an unresolved `crc32fast`, while
# Linux and macOS built clean. Pure Rust (miniz_oxide), so this pulls in no C
# zlib; feature unification is additive and cannot change updater behaviour.
flate2 = "1"

[features]
# Off by default: the default build ships the Python sidecar and needs no
# OpenCASCADE. On, the app runs the Rust engine as its own worker process.
rust-engine = ["dep:fundacad-protocol", "dep:fundacad-engine", "dep:fundacad-geom", "fundacad-geom/plugins"]

# Windows-only: a Job Object with KILL_ON_JOB_CLOSE reaps the sidecar (and its
# ProcessPoolExecutor workers) when the app exits or crashes. Unix uses a process
# group + PR_SET_PDEATHSIG instead (no extra dep).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# The shipped engine's own crates compile as one unit, which is what the root
# workspace's release profile does for the standalone engine. Kept per package
# rather than profile wide: `lto` and a workspace `codegen-units = 1` would
# apply to the whole Tauri app and its webview crates, and the release job pays
# that on every build.
[profile.release.package.fundacad-geom]
codegen-units = 1
[profile.release.package.fundacad-core]
codegen-units = 1
[profile.release.package.fundacad-protocol]
codegen-units = 1

# Its own workspace root until it joins the root workspace, so cargo run from a
# worktree nested inside another checkout does not adopt the outer workspace.
[workspace]
