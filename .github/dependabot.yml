version: 2
updates:
  # The composite actions in .github/actions call no other action, so the workflows directory covers every pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    # One pull request for every action bump, so one CI run tests them together.
    groups:
      actions:
        patterns:
          - "*"
