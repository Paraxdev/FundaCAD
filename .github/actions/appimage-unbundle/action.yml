name: Un-bundle the system stack from the AppImage
description: >
  Strip the bundled GTK/WebKit/GStreamer stack out of the AppImage, repack it
  and re-sign it.

inputs:
  signing-key:
    description: The minisign private key, empty to leave the AppImage unsigned.
    required: false
    default: ""
  signing-key-password:
    description: Password for the signing key.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The AppImage must NOT carry the GTK/WebKit/GStreamer stack. Tauri's AppImage
    # bundler copies webkit2gtk in explicitly and linuxdeploy pulls the rest of the GTK
    # stack in behind it, and that bundled stack aborts its own web process at startup
    # on any host running a modern WebKit: the window opens, the page never loads, and
    # before the load watchdog there was nothing in the log at all. Reported on NixOS
    # with WebKitGTK 2.50.4 (#3), reproduced on Arch with 2.52.5.
    #
    # It is not version skew. A 24.04-built bundle fails identically (PR #8), the
    # bundle is internally consistent (LD_DEBUG shows GTK/GLib/WebKit all resolving to
    # it), and the environment is not at fault either (the .deb binary runs fine under
    # the full set of variables the AppImage's GTK hook exports). What fails is that
    # bundled stack meeting the host's GPU drivers, which are never bundled and cannot
    # be. Removing the bundled stack outright is what fixes it, and it is the
    # configuration the .deb has shipped all along.
    #
    # Measured: with all 233 bundled system libraries removed, the AppImage starts and
    # leaves no coredump on a host where the shipped one does neither.
    - name: Un-bundle the system stack from the AppImage
      shell: bash
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-key-password }}
      run: |
        set -euo pipefail
        img=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
        [ -n "$img" ] || { echo "::error::no AppImage was produced"; exit 1; }
        echo "before: $(du -m "$img" | cut -f1) MB"

        work=$(mktemp -d)
        cp "$img" "$work/in.AppImage"
        (cd "$work" && ./in.AppImage --appimage-extract >/dev/null)
        root="$work/squashfs-root"

        find "$root/usr/lib" -maxdepth 1 -type f -name '*.so*' -delete
        rm -rf "$root/usr/lib/x86_64-linux-gnu"

        # One 256×256 raster of the app icon backs every icon the AppImage shows.
        # Tauri leaves .DirIcon as a symlink and the root icon named by the
        # desktop file's Icon= pointing at the 32×32 one, and the 256×256 theme
        # directory empty, so thumbnailers and the AppImage catalog got nothing
        # or a blurry icon.
        icon_name=$(sed -n 's/^Icon=//p' "$root"/*.desktop | head -1)
        [ -n "$icon_name" ] || { echo "::error::the desktop file names no Icon="; exit 1; }
        icon=src-tauri/icons/128x128@2x.png
        rm -f "${root:?}/.DirIcon" "${root:?}/${icon_name:?}.png"
        cp "$icon" "$root/.DirIcon"
        cp "$icon" "$root/$icon_name.png"
        install -Dm644 "$icon" "$root/usr/share/icons/hicolor/256x256/apps/$icon_name.png"

        # The geometry engine must still be there, or we just shipped a dead app.
        # It is the executable itself, so what is checked is that it came through.
        bin=$(find "$root/usr/bin" -maxdepth 1 -type f | head -1)
        test -n "$bin" && test -s "$bin" \
          || { echo "::error::nothing left in usr/bin"; ls -la "$root/usr"; exit 1; }
        # And that .DirIcon is a real file, not the symlink that was replaced:
        # a silent clobber of FundaCAD.png would leave a broken thumbnail icon.
        # It must also be the same image as the icon the desktop file names.
        test -f "$root/.DirIcon" && test ! -L "$root/.DirIcon" && test -s "$root/.DirIcon" \
          || { echo "::error::.DirIcon is missing or not a real file"; exit 1; }
        cmp -s "$root/.DirIcon" "$root/$icon_name.png" \
          || { echo "::error::.DirIcon is not the app icon"; exit 1; }
        # No Python anywhere: the retired engine's runtime, sidecar-runtime/, is
        # 800 MB of dead weight and a sign a stale config was used. The
        # directory under usr/lib is named after productName, read from the
        # config rather than hardcoded so a rename cannot blind the check.
        product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
        test ! -d "$root/usr/lib/$product/sidecar-runtime" \
          || { echo "::error::the bundle carries a Python runtime"; exit 1; }
        if [ -n "$(find "$root" \( -name 'python3*' -o -name 'libpython*' \) -print -quit)" ]; then
          echo "::error::the bundle carries a Python interpreter"; exit 1
        fi

        wget -qO "$work/appimagetool" \
          https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x "$work/appimagetool"
        ARCH=x86_64 "$work/appimagetool" --appimage-extract-and-run "$root" "$img"
        echo "after: $(du -m "$img" | cut -f1) MB"

        # The old .sig covers the old bytes. Leaving it would hand every existing
        # install an update whose signature does not verify.
        rm -f "$img.sig"
        if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
          npx --yes @tauri-apps/cli signer sign "$img"
          test -f "$img.sig"
        else
          echo "::warning::no signing key, AppImage left unsigned (not shippable)"
        fi
