name: Leave updater signing to the sign job
description: >
  Turn createUpdaterArtifacts off in a bundle config, and say whether the sign
  job signs this run's updater bundles (signing is on and the pubkey is ours).

inputs:
  config:
    description: The bundle config to patch.
    required: true
  signing:
    description: Whether the sign job signs this run's updater bundles ("true" from vars.UPDATER_SIGNING).
    required: false
    default: "false"

outputs:
  sign:
    description: '"true" when the sign job should sign the updater bundles of this run.'
    value: ${{ steps.decide.outputs.sign }}

runs:
  using: composite
  steps:
    # The signing key never reaches the bundle job, whose build runs npm and crates.io code: the sign job
    # signs the finished bundles. Dependabot runs, which get no secrets, bundle the same way.
    - name: Turn off updater artifacts in the bundle and decide whether they get signed
      id: decide
      shell: bash
      env:
        SIGNING: ${{ inputs.signing }}
        CONFIG: ${{ inputs.config }}
      run: |
        # Upstream's minisign public key, as inherited at the fork point. See
        # tests/security/updater.test.ts.
        UPSTREAM_PUBKEY='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDUwMkY3MDMzN0E1RUREMUYKUldRZjNWNTZNM0F2VU81ZU9YLzBPdDV6UVdkVklPOWg1S01zdU1lWitDMGR6aFg1cmJoZnYrMWIK'
        node -e "const fs=require('fs');const f=process.env.CONFIG;const j=JSON.parse(fs.readFileSync(f));j.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
        pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
        why=""
        [ "$SIGNING" = true ] || why="update signing is off (the UPDATER_SIGNING variable is not true)"
        # A signature made with a key whose public half is NOT the one baked
        # into the app is worse than no signature at all: every installed copy
        # rejects the update with nothing said here.
        [ "$pubkey" != "$UPSTREAM_PUBKEY" ] || why="the updater pubkey is still upstream's, so nothing we sign would verify"
        if [ -z "$why" ]; then
          echo "the sign job signs this run's updater bundles"
          echo "sign=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "::warning::No updater signatures: $why. The installers still build and are still shippable; they just do not update themselves."
        echo "sign=false" >> "$GITHUB_OUTPUT"
