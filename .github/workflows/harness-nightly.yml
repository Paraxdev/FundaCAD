# CI check only, it publishes nothing: once a night the browser harness tests no push runs, every one in
# tools/harness/tests/browser that is not marked smoke or a11y, against the newest dev commit whose build kept its
# engine. GitHub schedules a workflow only from the default branch, so this starts once it reaches main.
name: harness-nightly

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: harness-nightly
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # The engine artifact lives one day, a night with no dev push since has nothing new to test.
      - name: Find the newest dev build with its engine
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -eu
          for run in $(gh run list -R "$R" --workflow build.yml --branch dev --event push --limit 30 --json databaseId -q '.[].databaseId'); do
            gh api "repos/$R/actions/runs/$run/artifacts" \
              -q '.artifacts[] | select(.name == "fundacad-engine-linux" and (.expired | not)) | .id' | grep -q . || continue
            sha=$(gh api "repos/$R/actions/runs/$run" -q .head_sha)
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Testing dev at $sha with the engine of build run $run"
            exit 0
          done
          echo "::notice::no dev build of the last day kept its engine, nothing new to test"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.build.outputs.sha
        with:
          ref: ${{ steps.build.outputs.sha }}
          persist-credentials: false

      - name: Install Linux system dependencies
        if: steps.build.outputs.sha
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.build.outputs.sha
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: steps.build.outputs.sha
        run: |
          npm ci
          npm i --no-save playwright-core@1.56.0

      - name: Fetch the engine that build run built
        if: steps.build.outputs.sha
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fundacad-engine-linux
          path: engine-bin
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}

      - name: Install a software Vulkan driver
        if: steps.build.outputs.sha
        run: sudo timeout -k 10 600 apt-get install -y mesa-vulkan-drivers

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.build.outputs.sha
        with:
          python-version: "3.12"

      - name: Install the agent harness
        if: steps.build.outputs.sha
        run: pip install -e "tools/harness[test]"

      - name: Agent harness tests no push runs
        if: steps.build.outputs.sha
        env:
          FUNDACAD_ENGINE_CMD: ${{ github.workspace }}/engine-bin/fundacad-engine
          FUNDACAD_CHROME: /usr/bin/google-chrome
          FUNDACAD_HARNESS_KEEP: "1"
          TMPDIR: ${{ runner.temp }}/harness
        run: |
          chmod +x engine-bin/fundacad-engine
          mkdir -p "$TMPDIR"
          python -m pytest tools/harness/tests/browser -m "not smoke and not a11y" -q --durations=25

      - name: Agent harness logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-nightly-logs
          path: ${{ runner.temp }}/harness
          if-no-files-found: ignore
          retention-days: 7
