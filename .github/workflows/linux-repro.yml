# Diagnostic only: rebuilds one corner chamfer on Linux, in the shipped alpha
# and in builds of this commit, with the phase trace on, to tell a GCC
# optimiser problem from a slow path.
name: linux-repro

on:
  workflow_dispatch:
  push:
    branches: ["diag/**"]

jobs:
  shipped:
    runs-on: ubuntu-22.04
    steps:
      - name: Write the documents and the timing script
        shell: bash
        run: |
          cat > gen.py <<'PY'
          import json, os
          base = json.loads(r"""{"parameters":{},"features":[{"id":"f1","type":"sketch","plane":"XY","entities":[{"type":"rectangle","id":"e0","width":40,"height":40,"x":0,"y":0}]},{"id":"f2","type":"extrude","sketch":"f1","distance":15.23,"operation":"new","regions":[[0,0,0]],"hiddenBodies":[]},{"id":"f3","type":"chamfer","edges":[{"kind":"edge","by":"nearest","point":[0,-20,15.229999542236328],"body":"body1"},{"kind":"edge","by":"nearest","point":[20,0,15.229999542236328],"body":"body1"},{"kind":"edge","by":"nearest","point":[20,-20,7.614999771118164],"body":"body1"}],"distance":3.35}],"bodyIds":{"f2:0":"body1"},"paramDefs":{},"version":9}""")
          os.makedirs("diag", exist_ok=True)
          def put(name, **kw):
              d = json.loads(json.dumps(base))
              d["features"][2].update(kw)
              json.dump(d, open(f"diag/{name}.json", "w"))
          put("a_plain")
          put("b_draft", draft=True)
          put("c_section", tangentEdges=False)
          put("d_section_draft", tangentEdges=False, draft=True)
          put("e_fillet", type="fillet", radius=3.35)
          for i, v in enumerate([0.5, 1.0, 1.7, 2.4, 3.0, 3.35]):
              put(f"f_drag{i}", distance=v, draft=True)
          os.makedirs("sweep", exist_ok=True)
          for i in range(1, 200):
              d = json.loads(json.dumps(base))
              d["features"][2].update(distance=round(i * 0.023, 3), draft=True)
              json.dump(d, open(f"sweep/s{i:03d}.json", "w"))
          PY
          python3 gen.py
          cat > timebuild.py <<'PY'
          """usage: timebuild.py <mcp exe> <doc.json>...: time `build` for each document on one server."""
          import json, subprocess, sys, time

          exe, docs = sys.argv[1], sys.argv[2:]
          p = subprocess.Popen([exe], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          n = 0


          def call(method, params=None, notify=False):
              global n
              msg = {"jsonrpc": "2.0", "method": method}
              if params is not None:
                  msg["params"] = params
              if not notify:
                  n += 1
                  msg["id"] = n
              p.stdin.write((json.dumps(msg) + "\n").encode())
              p.stdin.flush()
              if notify:
                  return None
              while True:
                  r = json.loads(p.stdout.readline())
                  if r.get("id") == n:
                      return r


          def tool(name, args):
              return call("tools/call", {"name": name, "arguments": args})["result"]["content"][0]["text"]


          call("initialize", {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "t", "version": "1"}})
          call("notifications/initialized", notify=True)
          t = time.time()
          tool("doc_set", {"document": {"parameters": {}, "features": []}})
          tool("build", {})
          print(f"engine start {time.time() - t:.2f}s", flush=True)
          for d in docs:
              tool("doc_set", {"document": json.load(open(d))})
              t = time.time()
              out = tool("build", {})
              print(f"{d}: {time.time() - t:.2f}s | {out.splitlines()[-1][:200]}", flush=True)
          p.stdin.close()
          p.kill()
          PY

      - name: Run the released alpha's engine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FUNDACAD_MCP_MODE: standalone
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-0 libayatana-appindicator3-1 > /dev/null
          gh release download alpha -R ${{ github.repository }} -p "*_amd64.deb"
          dpkg-deb -x *_amd64.deb app
          find app -type f -perm -u+x | head -n 20
          mcp=$(find app -name fundacad-mcp -type f | head -n1)
          for load in 0 3; do
            for cpus in 0-3 0; do
              pids=""
              for k in $(seq 1 $load); do taskset -c 0 sh -c 'while :; do :; done' & pids="$pids $!"; done
              echo "=== sweep cpus $cpus load $load"
              timeout 1200 taskset -c $cpus python3 timebuild.py "$mcp" sweep/*.json > sweep.txt || echo "=== exit $?"
              [ -z "$pids" ] || kill $pids
              awk '{print $2, $1}' sweep.txt | sort -rn | head -n 6
              awk '{s+=$2} END {print "total", s, NR}' sweep.txt
            done
          done

  repro:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [release, before-planar-fix]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'before-planar-fix' && 'd7c14e629688d19b569b01bf2027ea1ddec2682b' || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the static OpenCASCADE build
        uses: actions/cache@v4
        with:
          path: target/OCCT
          key: occt-static-${{ runner.os }}-${{ hashFiles('third_party/opencascade-rs/crates/occt-sys/src/lib.rs', 'third_party/opencascade-rs/crates/opencascade-sys/build.rs', 'third_party/opencascade-rs/crates/opencascade-sys/Cargo.toml') }}

      - name: Build
        shell: bash
        run: |
          case "${{ matrix.variant }}" in
            release|before-planar-fix) cargo build --release -p fundacad-cli -p fundacad-mcp ;;
            sanitize)
              CXXFLAGS="-fsanitize=undefined,address -fno-omit-frame-pointer -O2 -g" \
              RUSTFLAGS="-C link-arg=-fsanitize=undefined,address" \
                cargo build --release -p fundacad-cli ;;
          esac

      - name: Write the documents and the timing script
        shell: bash
        run: |
          cat > gen.py <<'PY'
          import json, os
          base = json.loads(r"""{"parameters":{},"features":[{"id":"f1","type":"sketch","plane":"XY","entities":[{"type":"rectangle","id":"e0","width":40,"height":40,"x":0,"y":0}]},{"id":"f2","type":"extrude","sketch":"f1","distance":15.23,"operation":"new","regions":[[0,0,0]],"hiddenBodies":[]},{"id":"f3","type":"chamfer","edges":[{"kind":"edge","by":"nearest","point":[0,-20,15.229999542236328],"body":"body1"},{"kind":"edge","by":"nearest","point":[20,0,15.229999542236328],"body":"body1"},{"kind":"edge","by":"nearest","point":[20,-20,7.614999771118164],"body":"body1"}],"distance":3.35}],"bodyIds":{"f2:0":"body1"},"paramDefs":{},"version":9}""")
          os.makedirs("diag", exist_ok=True)
          def put(name, **kw):
              d = json.loads(json.dumps(base))
              d["features"][2].update(kw)
              json.dump(d, open(f"diag/{name}.json", "w"))
          put("a_plain")
          put("b_draft", draft=True)
          put("c_section", tangentEdges=False)
          put("d_section_draft", tangentEdges=False, draft=True)
          put("e_fillet", type="fillet", radius=3.35)
          for i, v in enumerate([0.5, 1.0, 1.7, 2.4, 3.0, 3.35]):
              put(f"f_drag{i}", distance=v, draft=True)
          os.makedirs("sweep", exist_ok=True)
          for i in range(1, 200):
              d = json.loads(json.dumps(base))
              d["features"][2].update(distance=round(i * 0.023, 3), draft=True)
              json.dump(d, open(f"sweep/s{i:03d}.json", "w"))
          PY
          python3 gen.py
          cat > timebuild.py <<'PY'
          """usage: timebuild.py <mcp exe> <doc.json>...: time `build` for each document on one server."""
          import json, subprocess, sys, time

          exe, docs = sys.argv[1], sys.argv[2:]
          p = subprocess.Popen([exe], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          n = 0


          def call(method, params=None, notify=False):
              global n
              msg = {"jsonrpc": "2.0", "method": method}
              if params is not None:
                  msg["params"] = params
              if not notify:
                  n += 1
                  msg["id"] = n
              p.stdin.write((json.dumps(msg) + "\n").encode())
              p.stdin.flush()
              if notify:
                  return None
              while True:
                  r = json.loads(p.stdout.readline())
                  if r.get("id") == n:
                      return r


          def tool(name, args):
              return call("tools/call", {"name": name, "arguments": args})["result"]["content"][0]["text"]


          call("initialize", {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "t", "version": "1"}})
          call("notifications/initialized", notify=True)
          t = time.time()
          tool("doc_set", {"document": {"parameters": {}, "features": []}})
          tool("build", {})
          print(f"engine start {time.time() - t:.2f}s", flush=True)
          for d in docs:
              tool("doc_set", {"document": json.load(open(d))})
              t = time.time()
              out = tool("build", {})
              print(f"{d}: {time.time() - t:.2f}s | {out.splitlines()[-1][:200]}", flush=True)
          p.stdin.close()
          p.kill()
          PY

      - name: Rebuild the corner chamfer and its variants
        shell: bash
        env:
          FUNDACAD_BENCH_PHASES: "1"
          RUST_BACKTRACE: "1"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          fail=0
          for d in diag/*.json; do
            start=$(date +%s.%N)
            set +e
            timeout -s INT 180 target/release/fundacad-engine rebuild "$d" --json > out.json 2> err.txt
            code=$?
            set -e
            echo "== $d exit $code after $(echo "$(date +%s.%N) - $start" | bc) s"
            grep -E "phases:|runtime error|AddressSanitizer|SUMMARY" err.txt | head -n 20 || true
            python3 -c "import json;r=json.loads(open('out.json').readline());print('ok',r.get('ok'),r.get('error'),[b.get('faceCount') for b in (r.get('result') or {}).get('bodies',[])])" || true
            [ $code -eq 0 ] || fail=1
          done
          if [ "${{ matrix.variant }}" != sanitize ]; then
            FUNDACAD_MCP_MODE=standalone timeout 600 python3 timebuild.py target/release/fundacad-mcp diag/*.json
            for load in 0 3; do
              for cpus in 0-3 0; do
                pids=""
                for k in $(seq 1 $load); do taskset -c 0 sh -c 'while :; do :; done' & pids="$pids $!"; done
                echo "=== sweep cpus $cpus load $load"
                FUNDACAD_MCP_MODE=standalone timeout 1200 taskset -c $cpus python3 timebuild.py target/release/fundacad-mcp sweep/*.json > sweep.txt || echo "=== exit $?"
                [ -z "$pids" ] || kill $pids
                awk '{print $2, $1}' sweep.txt | sort -rn | head -n 6
                awk '{s+=$2} END {print "total", s, NR}' sweep.txt
              done
            done
          fi
          exit $fail
