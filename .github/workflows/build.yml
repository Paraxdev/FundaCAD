# Cross-platform build + bundle for FundaCAD (Tauri 2 + bundled Python sidecar).
#
# No system OpenCASCADE anywhere: the Rust/OCCT path is behind the off-by-default
# `rust-geom` feature (see src-tauri/Cargo.toml), and the shipping geometry runs in the
# Python sidecar, whose cadquery-ocp-novtk wheels bundle their own OCCT. So this
# workflow has NO "build OCCT from source / brew / vcpkg" steps (they were removed when
# Move 1 gated OCCT out).
#
# Per OS it: builds a relocatable Python "sidecar-runtime" (uv + python-build-standalone
# installed from sidecar/uv.lock), then runs `tauri build` with the bundle-only config
# that ships that runtime as a resource, and uploads the installers.
#
# Scope: x86_64 Linux, Apple Silicon macOS, x86_64 Windows. (No Intel-mac / linux-arm64.)
#
# This branch is retired and publishes nothing. Its last build is the
# `legacy-final` release, and the `beta` tag now belongs to the Rust build on
# `main`, so a release job here would overwrite it. The jobs below only test and
# build.

name: build

on:
  push:
    branches: [legacy]
  pull_request:
  workflow_dispatch:

jobs:
  # Gates the build matrix: sidecar tests, Rust unit tests, and the (new) vitest
  # frontend tests all run BEFORE any installer is built. Runs once on Linux only,
  # the build matrix below still builds/bundles on all three platforms regardless.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Cheapest gate first: refuse agent/editor session artifacts and hardcoded
      # developer paths before spending 18 minutes on installers. This is a public
      # repo, .claude/settings.json and a home-directory layout both reached it
      # once already, and .gitignore can't catch an already-tracked path.
      - name: Repo hygiene
        run: sh scripts/check-repo-hygiene.sh

      # Same system deps as the build job's Linux leg: `cargo test --lib` links the
      # tauri crate, which needs the webkit2gtk stack + libudev (Rust device APIs).
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (vitest)
        run: npx vitest run

      # The plugin sandbox is a worker ENTRY, so Rollup treats its exports as
      # unreachable and drops them. That produced a chunk with none of the
      # sandbox in it, past every unit test, and would have failed at the first
      # line of the first plugin anyone ran. Only the built artifact shows it.
      - name: Plugin sandbox chunk survives the build
        run: node scripts/check-sandbox-chunk.mjs

      # The app ships the loader and nothing to load. What makes that true is one
      # `import.meta.env.DEV` branch in src/plugins/activate.ts, which vite
      # replaces with `false` so rollup drops the branch, the dynamic import
      # inside it, and src/plugins/devPlugins.ts with its glob of every plugin
      # directory. Nothing fails loudly if that branch is ever written a way
      # rollup cannot drop: the app keeps working, the plugins keep running from
      # the bundle, and "we do not ship them" becomes a claim rather than a fact.
      # Reads the artifact check-sandbox-chunk.mjs has just built.
      - name: The app ships no plugin code
        run: node scripts/check-no-plugin-code.mjs

      - name: Install Python 3.12 + sync sidecar deps (locked)
        run: |
          uv python install 3.12
          cd sidecar && uv sync

      # The sidecar tests are `__main__` scripts, not pytest-discoverable. This
      # used to be a hand-listed set and it kept rotting: eleven files across two
      # incidents sat here passing locally and never running in CI. The script
      # globs sidecar/tests and every plugin's tests, so a new test is covered the
      # moment it exists; SKIP is the only way out and every entry needs a reason.
      #
      # Four at a time on the runner's four cores. One after another this step
      # took 13.5 of the gate's 17 minutes, and every installer waits on the gate.
      # Files that bind the sidecar's port still run alone, after the rest.
      - name: Sidecar and plugin tests
        env:
          SKIP: test_conic_fuzz.py  # minutes-long blend sweep; runs in the eval job
          JOBS: 4
        run: bash scripts/run-sidecar-tests.sh

      # Geometry eval harnesses (fillet corpus, selector survival, real-server op
      # coverage). They are measurement oracles that always exit 0, so the script
      # supplies the thresholds. ~1 minute. Nothing ran these before, which is how
      # op coverage decayed 28/34 -> 23/34 unnoticed.
      - name: Geometry evals (thresholded)
        run: sh scripts/check-geometry-evals.sh

      # --tests, not --lib: tests/container_seam.rs drives a real STEP import
      # through the sidecar, packages it with the Rust container writer, extracts
      # it somewhere fresh and rebuilds from it. Nothing else proves the two
      # halves of that seam compose. It needs sidecar/.venv, which the `uv sync`
      # step above created.
      - name: Rust tests (unit + cross-language seam)
        working-directory: src-tauri
        run: cargo test --tests

  build:
    needs: test
    permissions:
      contents: read # this branch publishes nothing
    strategy:
      fail-fast: false # one OS failing must not hide the others' status
      matrix:
        include:
          # ubuntu-22.04: webkit2gtk-4.1 + a lower glibc, so the AppImage/.deb runs
          # on more systems than a -24.04 build would.
          - platform: ubuntu-22.04
          - platform: macos-14 # Apple Silicon (arm64) runner
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        # third_party/opencascade-rs is vendored in-repo (no submodules), and the
        # default build never compiles it, so a plain checkout is enough.

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: npm ci

      # --- the bundled Python geometry runtime (relocatable, novtk, from the lock) ---
      - name: Build sidecar runtime (Linux/macOS)
        if: matrix.platform != 'windows-latest'
        run: bash scripts/build-sidecar-runtime.sh

      - name: Build sidecar runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-sidecar-runtime.ps1

      # linuxdeploy resolves every ELF's dependencies by soname lookup, which can't
      # see the runtime's manylinux-vendored dirs (scipy.libs etc. reference their
      # mangled sonames via $ORIGIN rpaths). First AppImage run died on exactly that:
      # "Could not find dependency: libquadmath-2284e583.so.0.0.0". Put every runtime
      # dir holding a real shared library (lib*.so*, not python extension modules)
      # on LD_LIBRARY_PATH so dependency deployment can find the vendored names.
      - name: Expose vendored sidecar libs to linuxdeploy (AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          dirs=$(find "$PWD/src-tauri/sidecar-runtime" -name 'lib*.so*' -printf '%h\n' | sort -u | paste -sd: -)
          echo "LD_LIBRARY_PATH=$dirs" >> "$GITHUB_ENV"
          echo "vendored lib dirs:"; echo "$dirs" | tr ':' '\n'

      # Rolling-beta versioning: the updater compares semver, and every build being
      # 0.2.0 would mean "never an update". CI builds get 0.2.<run_number>; local
      # dev builds stay at the checked-in 0.2.0. The minor went from 1 to 2 with the
      # floating shell, and semver keeps every 0.2 build newer than any 0.1 one.
      - name: Stamp rolling version
        shell: bash
        run: |
          v="0.2.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='$v';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "stamped $v"

      # Dependabot-triggered runs get NO repository secrets, by GitHub's design -- so
      # TAURI_SIGNING_PRIVATE_KEY arrives empty and `tauri build` aborts with "failed
      # to decode secret key: Missing comment in secret key". That failed the build leg
      # on all three OSes for every dependency PR while the `test` gate passed, which
      # reads as "the bump broke the build" when nothing was wrong with the bump.
      #
      # Bundle WITHOUT updater artifacts in that case. The point of building a
      # dependency PR is to prove the bundle still assembles on all three OSes, not to
      # ship it. Deliberately NOT solved by giving Dependabot the signing key: that key
      # authorises pushing an update to every tester's machine, and a Dependabot run
      # executes the install scripts of the very package it just bumped.
      #
      # On a normal push the key is present, this is a no-op, and updater artifacts stay
      # signed -- the in-app updater and the `release` job's latest.json depend on that.
      - name: Disable updater artifacts when they could not be trusted
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Upstream's minisign public key, as inherited at the fork point. See
          # tests/security/updater.test.ts.
          UPSTREAM_PUBKEY='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDUwMkY3MDMzN0E1RUREMUYKUldRZjNWNTZNM0F2VU81ZU9YLzBPdDV6UVdkVklPOWg1S01zdU1lWitDMGR6aFg1cmJoZnYrMWIK'
          pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          why=""
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || why="there is no signing key (expected on Dependabot PRs)"
          # A signature made with a key whose public half is NOT the one baked
          # into the app is worse than no signature at all: the build looks
          # shippable, and every installed copy rejects the update with nothing
          # said here. Same treatment as a missing key.
          [ "$pubkey" != "$UPSTREAM_PUBKEY" ] || why="the updater pubkey is still upstream's, so nothing we sign would verify"
          if [ -z "$why" ]; then
            echo "signing key present and the pubkey is ours -- updater artifacts stay enabled"
            exit 0
          fi
          echo "::warning::No updater artifacts: $why. The installers still build and are still shippable; they just do not update themselves."
          node -e "const fs=require('fs');const f='src-tauri/tauri.bundle.conf.json';const j=JSON.parse(fs.readFileSync(f));j.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      # --- build + bundle. The bundle-only config ships sidecar-runtime/ as a resource
      #     and (on macOS) turns on hardened runtime + entitlements. ---
      - name: Build + bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In-app updater: updater bundles are minisign-signed with this key
          # (createUpdaterArtifacts in the bundle overlay config). Separate from OS
          # code signing, which stays deferred below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # linuxdeploy's strip pass chokes on the bundled sidecar runtime's
          # OCCT/CPython shared objects (AppImage leg: "failed to run linuxdeploy").
          # NO_STRIP is linuxdeploy's own escape hatch; harmless on the other OSes.
          NO_STRIP: true
          # UNSIGNED builds for now (Apple Developer Program deferred, no budget).
          # macOS ships unsigned, which current Gatekeeper reports as "the app is
          # damaged and can't be opened", right-click -> Open is NOT enough for an
          # app with no signature at all, and saying so in the README and release
          # notes is what sent the reporter of #5 to the issue tracker. The command
          # that works is `xattr -dr com.apple.quarantine /Applications/FundaCAD.app`.
          # Windows unsigned runs with a SmartScreen warning. To SIGN later: add the
          # APPLE_* / Windows signing secrets back here AND append the signing config:
          #   args: --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.macos-sign.conf.json
        with:
          # bundle-only config ships sidecar-runtime/ as a resource. (No macOS signing
          # block here, so tauri produces an unsigned .app without attempting codesign.)
          # --verbose so bundler sub-tool failures (linuxdeploy) show their real output.
          args: --verbose --config src-tauri/tauri.bundle.conf.json

      # KNOWN FOLLOW-UP (macOS notarization): notarization is NOT recursive, so every
      # embedded Mach-O under sidecar-runtime (libpython + the cadquery-ocp .dylibs)
      # must be signed with the hardened runtime. If notarization fails on the first
      # signed mac run, add a recursive `codesign --force --options runtime --sign
      # "$APPLE_SIGNING_IDENTITY"` pass over src-tauri/sidecar-runtime BEFORE this step.
      # Windows Authenticode: set bundle.windows.signCommand in the bundle config +
      # a signing secret to clear SmartScreen (optional; unsigned still runs).

      # The AppImage must NOT carry the GTK/WebKit/GStreamer stack. Tauri's AppImage
      # bundler copies webkit2gtk in explicitly and linuxdeploy pulls the rest of the GTK
      # stack in behind it, and that bundled stack aborts its own web process at startup
      # on any host running a modern WebKit: the window opens, the page never loads, and
      # before the load watchdog there was nothing in the log at all. Reported on NixOS
      # with WebKitGTK 2.50.4 (#3), reproduced on Arch with 2.52.5.
      #
      # It is not version skew. A 24.04-built bundle fails identically (PR #8), the
      # bundle is internally consistent (LD_DEBUG shows GTK/GLib/WebKit all resolving to
      # it), and the environment is not at fault either (the .deb binary runs fine under
      # the full set of variables the AppImage's GTK hook exports). What fails is that
      # bundled stack meeting the host's GPU drivers, which are never bundled and cannot
      # be. Removing the bundled stack outright is what fixes it, and it is the
      # configuration the .deb has shipped all along.
      #
      # Measured: with all 233 bundled system libraries removed, the AppImage starts and
      # leaves no coredump on a host where the shipped one does neither.
      #
      # usr/lib/<product> holds the Python geometry engine and MUST survive: it is the
      # app, not a system library, and no host provides it.
      - name: Un-bundle the system stack from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          img=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          [ -n "$img" ] || { echo "::error::no AppImage was produced"; exit 1; }
          echo "before: $(du -m "$img" | cut -f1) MB"

          work=$(mktemp -d)
          cp "$img" "$work/in.AppImage"
          (cd "$work" && ./in.AppImage --appimage-extract >/dev/null)
          root="$work/squashfs-root"

          find "$root/usr/lib" -maxdepth 1 -type f -name '*.so*' -delete
          rm -rf "$root/usr/lib/x86_64-linux-gnu"
          # The geometry engine must still be there, or we just shipped a dead app.
          # The directory is named after productName, so it is READ from the config
          # rather than written out here: hardcoding it meant this check silently
          # named a directory that no longer existed the moment the app was renamed,
          # and a `test -d` against the wrong path fails the job for the wrong reason.
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          test -d "$root/usr/lib/$product/sidecar-runtime"             || { echo "::error::no sidecar-runtime under usr/lib/$product";                  ls -la "$root/usr/lib"; exit 1; }

          wget -qO "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/appimagetool"
          ARCH=x86_64 "$work/appimagetool" --appimage-extract-and-run "$root" "$img"
          echo "after: $(du -m "$img" | cut -f1) MB"

          # The old .sig covers the old bytes. Leaving it would hand every existing
          # install an update whose signature does not verify.
          rm -f "$img.sig"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx --yes @tauri-apps/cli signer sign "$img"
            test -f "$img.sig"
          else
            echo "::warning::no signing key, AppImage left unsigned (not shippable)"
          fi

      # Tauri's CLI always writes `Depends: libwebkit2gtk-4.1-0, libgtk-3-0`, and
      # no config replaces it. Since the 64-bit time_t transition (Ubuntu 24.04
      # and everything built on it) the package is libgtk-3-0t64, and libgtk-3-0
      # only exists as a name it Provides. apt resolves that; Kubuntu's QApt
      # installer does not, and refuses the .deb with "Cannot satisfy
      # dependencies". Only the control member is swapped, the ~900MB data member
      # is left as it is, and nothing signs the .deb, so there is nothing to redo.
      - name: Depend on the renamed GTK package (deb)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find "$PWD/src-tauri/target/release/bundle/deb" -maxdepth 1 -name '*.deb' | head -1)
          [ -n "$deb" ] || { echo "::error::no .deb was produced"; exit 1; }
          work=$(mktemp -d)
          cd "$work"
          ar x "$deb" control.tar.gz
          mkdir control
          tar -xzf control.tar.gz -C control
          sed -i 's/^Depends: .*/Depends: libwebkit2gtk-4.1-0, libgtk-3-0t64 | libgtk-3-0/' control/control
          grep -qxF 'Depends: libwebkit2gtk-4.1-0, libgtk-3-0t64 | libgtk-3-0' control/control \
            || { echo "::error::Depends line not rewritten"; cat control/control; exit 1; }
          tar -czf control.tar.gz --owner=0 --group=0 -C control .
          ar r "$deb" control.tar.gz
          dpkg-deb -f "$deb" Depends
          # The member order dpkg requires, and a data member that still reads.
          [ "$(ar t "$deb" | head -2 | tr '\n' ' ')" = "debian-binary control.tar.gz " ]
          # To a file: grep -q stops reading at its match, and under pipefail the
          # listing's broken pipe fails the step.
          dpkg-deb -c "$deb" > listing.txt
          grep -q 'usr/bin/fundacad' listing.txt

      # A PORTABLE Windows build: unzip anywhere, run fundacad.exe, no installer
      # and no admin rights. An installer is a poor fit for a machine you do not
      # administer, or for keeping several builds side by side to compare them.
      #
      # Its contents are EXTRACTED FROM THE MSI rather than assembled by hand. A
      # hand-built tree would be a second and silently drifting opinion about
      # what the app consists of: the exe and whichever resources were current on
      # the day it was written. `msiexec /a` performs an administrative install,
      # which unpacks the package's payload without installing it, so the folder
      # is by construction the same file set a real install lays down.
      #
      # Portable means no installer, not no traces: preferences and recent files
      # still live in the user profile, as they do for an installed copy. The
      # readme inside the zip says so rather than leaving it to be discovered.
      - name: Portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "no .msi was produced, so there is nothing to unpack" }

          $stage = Join-Path $PWD "portable-stage"
          $log = Join-Path $PWD "msi-extract.log"
          $proc = Start-Process msiexec -Wait -PassThru -ArgumentList @(
            "/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$stage`"", "/l*v", "`"$log`"")
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "msiexec /a failed with $($proc.ExitCode)"
          }

          # An administrative install drops a copy of the package itself beside
          # the payload. Nobody wants an installer inside the portable zip.
          Get-ChildItem $stage -Filter *.msi | Remove-Item -Force

          $exe = Get-ChildItem $stage -Recurse -Filter fundacad.exe | Select-Object -First 1
          if (-not $exe) { throw "no fundacad.exe in the unpacked payload" }
          $root = $exe.Directory.FullName

          # The geometry engine IS the app, not an extra. A zip with the exe and
          # no interpreter starts, opens a window, and can never build anything.
          if (-not (Test-Path (Join-Path $root "sidecar-runtime/python/python.exe"))) {
            Get-ChildItem $root | Select-Object -ExpandProperty Name
            throw "no bundled Python at sidecar-runtime/python/python.exe"
          }

          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $out = Join-Path $PWD "src-tauri/target/release/bundle/portable"
          $pack = Join-Path $out "pack"
          $folder = Join-Path $pack "FundaCAD"
          New-Item -ItemType Directory -Force -Path $pack | Out-Null
          Copy-Item $root $folder -Recurse

          # An ARRAY, not a here-string: a here-string's closing marker has to sit
          # at column 0, and every line of this script is indented by the YAML
          # block it lives in.
          Set-Content -Path (Join-Path $folder "README.txt") -Encoding utf8 -Value @(
            "FundaCAD $version, portable build",
            "",
            "Run fundacad.exe. There is nothing to install and no admin rights are",
            "needed. Move or copy this folder wherever you like, a USB stick",
            "included, and it goes on working.",
            "",
            "The first run shows a SmartScreen warning, Windows protected your PC.",
            "Choose More info, then Run anyway. The build is not code signed, and",
            "that is what SmartScreen is reporting.",
            "",
            "Needs the Microsoft Edge WebView2 runtime, which Windows 11 and an",
            "up to date Windows 10 already have. If no window ever appears, get it",
            "from https://developer.microsoft.com/microsoft-edge/webview2/",
            "",
            "Portable means no installer, not no traces: preferences and recent",
            "files are kept in your user profile, the same as an installed copy.",
            "",
            "This build does not update itself. Newer ones are at",
            "https://github.com/Paraxdev/fundacad/releases/tag/beta"
          )

          $zip = Join-Path $out "FundaCAD_${version}_x64_portable.zip"
          # .NET rather than Compress-Archive: the payload is a few thousand files
          # and several hundred megabytes, which Compress-Archive walks one
          # pipeline object at a time.
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $pack, $zip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Remove-Item $pack -Recurse -Force
          Write-Host "portable zip: $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"

      # For a person to download a build of this branch, which publishes no
      # release any more.
      #
      # The default retention is 90 days, and at ~1.6 GB a run that is where the
      # storage went: 98 artifacts and 55 GB, which is what made FinalizeArtifact
      # answer 403 Forbidden and fail an otherwise green build. A day is enough.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundacad-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*_portable.zip
            src-tauri/target/release/bundle/**/*.sig

  # docs/IMPROVEMENT-AUDIT.md §5.4: the opt-in `rust-geom` feature (src-tauri/src/geom.rs,
  # 2320 lines / 67 unwrap-or-expect calls) is never compiled by the `build` job above
  # (default build is OCCT-free by design, see the Cargo.toml comment on the feature),
  # so it can silently bit-rot. This job is a manual, non-gating bit-rot check: it does
  # NOT run on push/PR and nothing `needs:` it.
  #
  # ubuntu-22.04's package repos top out around OCCT 7.6, but opencascade-sys (the
  # vendored third_party/opencascade-rs fork) requires OCCT >= 7.9, which isn't
  # available as a hosted-runner apt package, so this step is EXPECTED TO FAIL on
  # today's runners until either a newer runner image ships OCCT >= 7.9, or a step is
  # added here to build OCCT >= 7.9 from source (slow; deliberately not done today).
  # Trigger to revisit: when a runner image with OCCT 7.9 exists, or when rust-geom
  # gets promoted off the experimental-spike path.
  # Browser end-to-end checks for the imported-assembly Browser tree.
  #
  # Deliberately NON-GATING: nothing `needs:` this job, exactly like
  # rust-geom-check below, so a browser flake can never fail the build.
  # That matters here because a green `build` auto-publishes to users who
  # auto-update, and browser e2e is the classic flaky surface.
  #
  # These exist because everything else about the assembly tree is unit tests and
  # row counts. The render-signature bug (a document whose product NAMES changed
  # while its bodies did not never repainted the panel) passed every unit test and
  # was only caught by looking at the rendered panel.
  #
  # Uses the runner's PREINSTALLED Google Chrome rather than downloading a browser,
  # and installs playwright-core with --no-save so the main build path keeps its
  # dependency set unchanged.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend dependencies
        run: |
          npm ci
          npm i --no-save playwright-core@1.56.0

      - name: Install Python 3.12 + sync sidecar deps (locked)
        run: |
          uv python install 3.12
          cd sidecar && uv sync

      - name: Start the geometry sidecar and vite
        run: |
          cd sidecar && FUNDACAD_SIDECAR_PORT=8765 FUNDACAD_SIDECAR_TOKEN=citoken \
            uv run python server.py > /tmp/ci_sidecar.log 2>&1 &
          cd "$GITHUB_WORKSPACE" && npx vite --port 5173 > /tmp/ci_vite.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "LISTENING 8765" /tmp/ci_sidecar.log 2>/dev/null && break
            sleep 2
          done
          grep -q "LISTENING 8765" /tmp/ci_sidecar.log || { echo "sidecar never listened"; cat /tmp/ci_sidecar.log; exit 1; }

      # e2e/browser_tree_perf.cjs is deliberately NOT run here: it is a
      # benchmark whose verdict compares two medians, and a shared runner's
      # noise can invert that. Run it by hand (see its header).
      - name: Assembly tree end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/assembly_tree_e2e.cjs

      - name: History column end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/history_side_e2e.cjs

      - name: Sidecar log on failure
        if: failure()
        run: tail -50 /tmp/ci_sidecar.log /tmp/ci_vite.log || true

  rust-geom-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # A PROBE, not a gate. The rust-geom path needs OCCT >= 7.9, which no
      # runner image ships yet, so this is expected to fail and the point of it
      # is to notice the day it stops failing. It ran red on the first dispatch
      # that ever reached it and painted the whole run red with it, which would
      # make every future publish look broken. Report the outcome, exit 0 either
      # way, and let the build/test/e2e jobs be the ones that can fail a run.
      - name: cargo check --features rust-geom (probe, expected to fail until OCCT 7.9 is available)
        working-directory: src-tauri
        run: |
          if cargo check --features rust-geom; then
            echo "::notice title=rust-geom::the rust geometry path now COMPILES here. Time to gate it."
          else
            echo "::notice title=rust-geom::rust-geom still does not build here (OCCT >= 7.9 unavailable). Probe only, not a failure."
          fi
