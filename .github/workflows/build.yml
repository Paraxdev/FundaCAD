# Cross-platform build + bundle for FundaCAD 1.0: Tauri 2 around the Rust
# geometry engine (docs/ENGINE.md), which runs as a worker process of the
# same executable.
#
# No SYSTEM OpenCASCADE anywhere, on any platform: the occt-sys crate carries
# the 7.8.1 sources and builds them statically into the binary. So this
# workflow has no brew, vcpkg or apt OCCT step.
#
# `bundle` + `release` publish two rolling pre-releases, each with its own
# update feed (docs/ENGINE.md section 7). A push to `main` publishes the
# `beta`, once every gating job is green. A push to `dev`, where daily work
# lands, publishes the bleeding edge `development` build even when its tests
# are red, and the run still shows red. A
# `v1.<minor>.<patch>` tag on a commit of `main` still publishes a stable
# release, though nothing sends people there. The retired Python engine is
# frozen on the `legacy` branch, which publishes nothing.
#
# Scope: x86_64 Linux, Apple Silicon macOS, x86_64 Windows. (No Intel-mac / linux-arm64.)

name: build

on:
  push:
    branches: [main, dev]
    tags: ["v1.*.*"]
    paths-ignore:
      - "manual/**"
  pull_request:
    paths-ignore:
      - "manual/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Gates the beta and stable installers with the frontend checks, BEFORE any
  # of them is built. Runs once on Linux only. The engine's own tests are
  # `rust-geom`, which gates them too. On dev both only report.
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Cheapest gate first: refuse agent/editor session artifacts and hardcoded
      # developer paths before spending 18 minutes on installers. This is a public
      # repo, .claude/settings.json and a home-directory layout both reached it
      # once already, and .gitignore can't catch an already-tracked path.
      - name: Repo hygiene
        run: sh scripts/check-repo-hygiene.sh

      # No deps, so the runner's own node is enough this early.
      - name: UI controls
        run: node scripts/check-ui-controls.mjs

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Never cargo fmt --all: it follows path dependencies into third_party and
      # rewrites vendored code. src-tauri and each plugin's geometry-rs are their
      # own workspaces, and build_identity.rs is include!d by two build.rs files,
      # so plain cargo fmt never reaches it.
      - name: Code is formatted (Prettier, rustfmt)
        run: |
          npx prettier --check .
          cargo fmt --check
          (cd src-tauri && cargo fmt --check)
          for p in Organic PrintToolbox Printing Screws Texture; do (cd plugins/FundaCAD.$p/geometry-rs && cargo fmt --check) || exit 1; done
          rustfmt --edition 2021 --check crates/fundacad-engine/build_identity.rs

      - name: Frontend unit tests (vitest)
        run: npx vitest run

      # The driver the bundle legs start each package with, against a fake server.
      - name: Bundle smoke driver tests
        run: python3 tests/build/test_bundle_smoke.py

      # The notes part of the release job's Publish step, against a stub gh.
      - name: Release notes tests
        run: python3 tests/build/test_release_notes.py

      # The step that keeps every beta as its own v1.0.<run number> release.
      - name: Version release tests
        run: python3 tests/build/test_version_release.py

      # The checks of the AT-SPI dump the bundle leg runs, against fake trees.
      - name: AT-SPI dump tests
        run: python3 tests/build/test_atspi_dump.py

      # The plugin sandbox is a worker ENTRY, so Rollup treats its exports as
      # unreachable and drops them. That produced a chunk with none of the
      # sandbox in it, past every unit test, and would have failed at the first
      # line of the first plugin anyone ran. Only the built artifact shows it.
      - name: Plugin sandbox chunk survives the build
        run: node scripts/check-sandbox-chunk.mjs

      # The app ships the loader and nothing to load. What makes that true is one
      # `import.meta.env.DEV` branch in src/plugins/activate.ts, which vite
      # replaces with `false` so rollup drops the branch, the dynamic import
      # inside it, and src/plugins/devPlugins.ts with its glob of every plugin
      # directory. Nothing fails loudly if that branch is ever written a way
      # rollup cannot drop: the app keeps working, the plugins keep running from
      # the bundle, and "we do not ship them" becomes a claim rather than a fact.
      # Reads the artifact check-sandbox-chunk.mjs has just built.
      - name: The app ships no plugin code
        run: node scripts/check-no-plugin-code.mjs

      # The spacenavd socket tests run only on unix. The crate is std only, so
      # this builds in seconds, without Tauri or the kernel.
      - name: 3D mouse spacenavd tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/spnav-target
        run: cargo test --manifest-path src-tauri/spnav/Cargo.toml -- --test-threads=4

      # The app's log file, rotation and redirect, std only like the above.
      - name: Linux log file tests
        run: |
          rustc --edition 2021 --test -D warnings src-tauri/tests/unit/log_file.rs -o "$RUNNER_TEMP/log_file_test"
          "$RUNNER_TEMP/log_file_test"

  # What this run builds and where it goes (docs/ENGINE.md section 7). `config`
  # is empty on a ref that builds no installers. `gated` is false on dev, whose
  # installers still start after `test` and `rust-geom` finish but do not need
  # them green, and where a failed bundle leg only leaves its own files out.
  channel:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      config: ${{ steps.pick.outputs.config }}
      release: ${{ steps.pick.outputs.release }}
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      sha: ${{ steps.pick.outputs.sha }}
      since: ${{ steps.pick.outputs.since }}
      gated: ${{ steps.pick.outputs.gated }}
    steps:
      # Only a tag needs the history, to find main and the stable tags before it.
      - uses: actions/checkout@v4
        if: github.ref_type == 'tag'
        with:
          fetch-depth: 0
          filter: tree:0

      - id: pick
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          config='' release='' tag='' since='' gated=true
          version="1.0.${{ github.run_number }}"
          sha='${{ github.sha }}'
          # Minor 0 is the betas' 1.0.<run number>, which a stable 1.0.x
          # would be older than.
          stable='^v1\.([1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          case "$REF" in
            refs/heads/dev)  config=dev release=development tag=development gated=false ;;
            refs/heads/main) config=beta release=beta tag=beta ;;
            refs/tags/*)
              # Optional now, nothing sends people to a stable release, but
              # the path still works for a tag pushed by hand or by
              # scripts/promote.sh --stable.
              [[ "$REF_NAME" =~ $stable ]] \
                || { echo "::error::$REF_NAME is not a stable tag, those are v1.<minor>.<patch> with a minor of 1 or more"; exit 1; }
              sha=$(git rev-parse HEAD)
              git merge-base --is-ancestor "$sha" origin/main \
                || { echo "::error::$REF_NAME points at ${sha:0:7}, which is not on main. Stable releases are cut from main only."; exit 1; }
              config=stable release=stable tag="$REF_NAME" version="${REF_NAME#v}"
              tags=$(git tag -l --merged origin/main 'v1.*' | grep -E "$stable" | sort -V)
              prev=$(printf '%s\n' "$tags" | grep -xF -B1 "$REF_NAME" | grep -vxF "$REF_NAME" || true)
              [ -z "$prev" ] || since=$(git rev-parse "$prev^{commit}")
              ;;
          esac
          printf '%s=%s\n' config "$config" release "$release" tag "$tag" version "$version" \
            sha "$sha" since "$since" gated "$gated" | tee -a "$GITHUB_OUTPUT"

  # The installers (docs/ENGINE.md section 6), on three platforms. The
  # engine is a worker process of the same executable, and there is no Python
  # in the bundle at all.
  #
  # Pushes and dispatches only, never a pull request. OpenCASCADE 7.8.1 is
  # compiled from source into the binary on each platform, twenty minutes cold,
  # and a pull request is already told whether the engine compiles by the
  # `rust-geom` job.
  bundle:
    needs: [channel, test, rust-geom]
    permissions:
      contents: write # tauri-action may attach artifacts to a draft release
    if: >-
      !cancelled() && needs.channel.outputs.config != ''
      && (needs.channel.outputs.gated == 'false'
          || (needs.test.result == 'success' && needs.rust-geom.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-14 # Apple Silicon (arm64) runner
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        # third_party/opencascade-rs is vendored in-repo (no submodules), and
        # this build DOES compile it, so a plain checkout is still enough.

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps

      # The one thing linux-deps leaves out, for the OpenCASCADE build.
      - name: Install cmake (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get install -y cmake

      # appimagetool downloads the AppImage runtime from GitHub on every run,
      # once, with no retry, and a single 500 from GitHub failed the whole
      # Linux build. Fetch it here with retries and hand it to both packers:
      # linuxdeploy's AppImage plugin reads LDAI_RUNTIME_FILE, and
      # appimage-unbundle passes it to appimagetool as --runtime-file.
      - name: Fetch the AppImage runtime (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP/runtime-x86_64"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$rt" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          test -s "$rt"
          echo "LDAI_RUNTIME_FILE=$rt" >> "$GITHUB_ENV"

      # wasm32-wasip2 for the plugin geometry components packed below.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # A release exe is a GUI subsystem process with no std handles, so its log
      # file is the only place its output lands. std only, so this takes seconds.
      - name: Windows log file tests
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings src-tauri/tests/unit/log_file.rs -o "$RUNNER_TEMP/log_file_test.exe"
          "$RUNNER_TEMP/log_file_test.exe"

      # The root workspace too: fundacad-mcp is built there. A cache saved on
      # a tag is only ever read by that tag's re-runs, and the quota is shared.
      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            . -> target
          key: alpha
          save-if: ${{ github.ref_type != 'tag' }}

      # The kernel is installed into target/OCCT at the repo root (the root
      # .cargo/config.toml sets FUNDACAD_OCCT_ROOT, src-tauri reads it too),
      # which rust-cache does not keep. Without this every run pays the twenty
      # minute OCCT build again on every platform. Only the install is kept,
      # the build tree beside it is two thirds of the size and never read once
      # the install is there.
      #
      # Keyed on the three files that decide what gets built, NOT on Cargo.lock:
      # the kernel does not change when some unrelated crate is bumped, and a
      # key that moved with the lock would throw the build away most weeks.
      #
      # Keep this step after rust-cache: post steps run in reverse, so this one
      # saves before rust-cache's cleanup, which takes target/OCCT for a profile
      # dir and deletes its lib, include and cmake.
      - name: Cache the static OpenCASCADE build
        uses: actions/cache@v4
        with:
          path: |
            target/OCCT
            !target/OCCT/build
          key: occt-static-${{ runner.os }}-${{ hashFiles('third_party/opencascade-rs/crates/occt-sys/src/lib.rs', 'third_party/opencascade-rs/crates/opencascade-sys/build.rs', 'third_party/opencascade-rs/crates/opencascade-sys/Cargo.toml') }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The bundle configs declare no resources, so nothing beside the
      # executable and the MCP server can end up in the bundle by accident.
      - name: The bundle declares no resources
        shell: bash
        run: |
          node -e "
            for (const f of ['./src-tauri/tauri.conf.json', './src-tauri/tauri.beta.conf.json', './src-tauri/tauri.dev.conf.json', './src-tauri/tauri.stable.conf.json']) {
              if (require(f).bundle.resources) { console.error(f + ' bundles resources'); process.exit(1); }
            }
          "

      # Rolling versioning, 1.0.<run_number>, for the beta and the development
      # build alike: the Rust engine is the major upgrade, against the retired
      # Python engine's 0.2. A stable build takes its version from its tag.
      #
      # No `-beta` suffix: tauri's msi target refuses a version whose
      # pre-release identifier is not numeric ("optional pre-release identifier
      # in app version must be numeric-only"), so it fails the Windows leg
      # outright and NSIS silently rewrites it to 0 in VIProductVersion. The
      # tag, the title and the update feed name the channel instead.
      - name: Stamp the version
        shell: bash
        run: |
          v="${{ needs.channel.outputs.version }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='$v';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "stamped $v"

      - name: Disable updater artifacts when they could not be trusted
        uses: ./.github/actions/updater-artifacts
        with:
          config: src-tauri/tauri.${{ needs.channel.outputs.config }}.conf.json
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Plugin bundles for this release, built from the same commit as the
      # engine that runs their components. Once, not per platform: a bundle is
      # the same bytes whoever builds it.
      - name: Package the plugins
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-plugins.py dist-plugins
          want=$(ls -d plugins/*/manifest.json | wc -l)
          got=$(ls dist-plugins/plugin-*.zip | wc -l)
          if [ "$want" != "$got" ]; then
            echo "packaged $got bundles for $want plugin directories" >&2
            exit 1
          fi
          # A plugin that names a component and ships without it would install
          # and then refuse every feature it declares.
          for m in plugins/*/manifest.json; do
            wasm=$(node -p "require('./$m').geometryWasm || ''")
            [ -n "$wasm" ] || continue
            id=$(node -p "require('./$m').id")
            unzip -l "dist-plugins/plugin-$id.zip" | grep -q " $wasm\$" \
              || { echo "::error::plugin-$id.zip has no $wasm"; exit 1; }
          done

      - name: Upload plugin bundles
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: fundacad-bundle-plugins
          retention-days: 7
          if-no-files-found: error
          path: dist-plugins/plugin-*.zip

      # The development build is its own product on Windows and macOS, FundaCAD
      # Dev with its own identifier, binary, Start menu entry and install folder,
      # so it installs beside the beta (tauri.dev-product.conf.json). Linux keeps
      # the beta's names: its .deb, Flatpak and container checks are keyed on
      # dev.fundacad.app and usr/bin/fundacad, and two .debs cannot both own the
      # udev rule and the MIME file anyway. It shows dev-<run> there too.
      - name: Pick the product the build is named as
        shell: bash
        run: |
          set -euo pipefail
          args="--config src-tauri/tauri.${{ needs.channel.outputs.config }}.conf.json"
          bin=fundacad
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          if [ "${{ needs.channel.outputs.config }}" = dev ] && [ "$RUNNER_OS" != Linux ]; then
            args="$args --config src-tauri/tauri.dev-product.conf.json"
            bin=$(node -p "require('./src-tauri/tauri.dev-product.conf.json').mainBinaryName")
            product=$(node -p "require('./src-tauri/tauri.dev-product.conf.json').productName")
          fi
          printf '%s=%s\n' TAURI_CONFIG_ARGS "$args" FUNDACAD_BIN "$bin" FUNDACAD_PRODUCT "$product" | tee -a "$GITHUB_ENV"

      # --- build + bundle. The app also exposes the MCP server through its
      #     --mcp mode. ---
      - name: Build + bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # CMake 4 refuses OCCT 7.8.1's declared minimum. Harmless on a runner
          # still shipping CMake 3, and the day one moves this is why it builds.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          NO_STRIP: true
          VITE_FUNDACAD_RELEASE: ${{ needs.channel.outputs.tag || 'beta' }}
        with:
          args: --verbose ${{ env.TAURI_CONFIG_ARGS }}

      # Checked against the bytes rather than the arguments: `engine_attach` is
      # the IPC command the webview reaches the engine through
      # (src-tauri/src/lib.rs), and it is also what fundacad-mcp looks for to
      # recognise an app it can start as its engine.
      - name: The shipped binary carries the engine
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find src-tauri/target/release -maxdepth 1 -type f \( -name "$FUNDACAD_BIN" -o -name "$FUNDACAD_BIN.exe" \) | head -1)
          [ -n "$bin" ] || { echo "::error::no fundacad binary was produced"; exit 1; }
          node -e "
            const fs = require('fs');
            const hay = fs.readFileSync(process.argv[1]);
            if (hay.indexOf(Buffer.from('engine_attach')) < 0) {
              console.error('::error::the binary registers no engine_attach command, so the webview cannot reach the engine');
              process.exit(1);
            }
            console.log('engine_attach found');
          " "$bin"
          node -e "
            const fs = require('fs');
            const hay = fs.readFileSync(process.argv[1]);
            if (hay.indexOf(Buffer.from('the stdio transport failed')) < 0) {
              console.error('::error::the binary carries no MCP stdio server');
              process.exit(1);
            }
            console.log('MCP stdio server found');
          " "$bin"

      - name: Un-bundle the system stack from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/appimage-unbundle
        with:
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Depend on the renamed GTK package (deb)
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/deb-gtk-depends

      # Started, not only grepped: each package runs its own MCP server, which
      # starts the same binary as its engine, and builds a 30x20x10 box. After
      # the two package rewrites above, so what starts is what ships, and before
      # the upload, so a red smoke names the upload failed-bundle. On dev that
      # is an annotation and the development build still ships, on main it
      # fails the leg and holds the beta (docs/ENGINE.md section 7). This runner
      # has every library linux-deps installs, so a wrong Depends still passes
      # here; the Flatpak's clean runtime and a container job are what catch it.
      - name: Start the AppImage and the .deb's binary and build a box
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: ${{ needs.channel.outputs.gated == 'false' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          img=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -1)
          if [ -z "$img" ] || [ -z "$deb" ]; then echo "::error::no AppImage or .deb to start"; exit 1; fi
          chmod +x "$img"
          fuse=()
          if ! { [ -e /dev/fuse ] && { command -v fusermount3 || command -v fusermount; } >/dev/null; }; then
            echo "No FUSE on this runner, the AppImage runs extracted"
            fuse=(--appimage-extract-and-run)
          fi
          red=0
          if ! python3 scripts/bundle-smoke.py --work "$RUNNER_TEMP/smoke-appimage" -- "$img" "${fuse[@]}" --mcp; then
            # The runtime names FUSE when it cannot mount, which is this
            # runner, not the package; anything else is the package.
            if [ ${#fuse[@]} -eq 0 ] && grep -qi fuse "$RUNNER_TEMP/smoke-appimage/server.log"; then
              echo "::warning::the AppImage could not mount here, it runs extracted"
              python3 scripts/bundle-smoke.py --work "$RUNNER_TEMP/smoke-appimage-x" -- "$img" --appimage-extract-and-run --mcp || red=1
            else
              red=1
            fi
          fi
          # The .deb as well when the AppImage was red, so one run names both.
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          python3 scripts/bundle-smoke.py --work "$RUNNER_TEMP/smoke-deb" -- "$RUNNER_TEMP/deb-root/usr/bin/fundacad" --mcp || red=1
          exit "$red"

      # The window as well: the AppImage under Xvfb, and a box built through
      # the server attached to it. An attached edit only returns once the
      # page has adopted it, so this proves WebKit loaded the page and its
      # scripts run. Not a gate until it has run green on the runner.
      - name: Open the AppImage window under Xvfb and build a box in it
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout -k 10 300 apt-get install -y -qq xvfb
          img=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          fuse=()
          if ! { [ -e /dev/fuse ] && { command -v fusermount3 || command -v fusermount; } >/dev/null; }; then
            fuse=(--appimage-extract-and-run)
          fi
          export XDG_DATA_HOME="$RUNNER_TEMP/gui-data" WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1
          session="$XDG_DATA_HOME/dev.fundacad.app/session.json"
          mkdir -p "$XDG_DATA_HOME"
          setsid xvfb-run -a "$img" "${fuse[@]}" > "$RUNNER_TEMP/gui.log" 2>&1 &
          gui=$!
          trap 'kill -- -"$gui" 2>/dev/null || true' EXIT
          for _ in $(seq 120); do [ -f "$session" ] && break; sleep 1; done
          if [ ! -f "$session" ]; then
            echo "::error::the app wrote no session file in 120 s"; tail -n 50 "$RUNNER_TEMP/gui.log" "$XDG_DATA_HOME/dev.fundacad.app/logs/fundacad.log" || true; exit 1
          fi
          FUNDACAD_MCP_MODE=attach FUNDACAD_SESSION_FILE="$session" \
            python3 scripts/bundle-smoke.py --work "$RUNNER_TEMP/smoke-gui" -- "$RUNNER_TEMP/deb-root/usr/bin/fundacad" --mcp

      # What Orca reads: the AppImage on its own accessibility bus, its AT-SPI
      # tree dumped and red on a nameless button or no web document. Not a gate
      # until wave 1 of the accessibility work has run green here.
      - name: Dump the AppImage accessibility tree over AT-SPI
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout -k 10 300 apt-get install -y -qq xvfb at-spi2-core gir1.2-atspi-2.0 python3-gi libglib2.0-bin
          img=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          if [ -z "$img" ]; then echo "::error::no AppImage to start"; exit 1; fi
          dbus-run-session -- bash scripts/a11y/atspi-run.sh "$img" "$RUNNER_TEMP/atspi"

      - name: Upload the AT-SPI dump
        if: always() && matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: atspi-dump
          path: |
            ${{ runner.temp }}/atspi/*.txt
            ${{ runner.temp }}/atspi/*.log
          if-no-files-found: ignore
          retention-days: 7

      # The portable exe the release uploads, and the macOS app's binary, which
      # Tauri names after the binary or the product depending on its version.
      - name: Start the shipped executable and build a box
        if: matrix.platform != 'ubuntu-22.04'
        continue-on-error: ${{ needs.channel.outputs.gated == 'false' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) bin=src-tauri/target/release/$FUNDACAD_BIN.exe py=python ;;
            macOS) bin=$(find src-tauri/target/release/bundle/macos -ipath "*.app/Contents/MacOS/$FUNDACAD_BIN" | head -1) py=python3 ;;
          esac
          if [ -z "${bin:-}" ] || [ ! -f "$bin" ]; then echo "::error::no executable to start"; exit 1; fi
          "$py" scripts/bundle-smoke.py --work "$RUNNER_TEMP/smoke-exe" -- "$bin" --mcp

      # The updater runs the installer as `/P /R /UPDATE`, and from the portable
      # build that is the first install, which has to make the Start menu entry
      # (src-tauri/windows/installer-hooks.nsh). An update over an install whose
      # entry was removed leaves it removed. /R is left out, it would start the
      # app. Not a gate until it has run green on the runner.
      - name: Install as the updater does and find the Start menu entry
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS installer was produced' }
          if (-not $setup.Name.StartsWith("$($env:FUNDACAD_PRODUCT)_")) { throw "$($setup.Name) is not named after $env:FUNDACAD_PRODUCT" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) "$($env:FUNDACAD_PRODUCT).lnk"
          $exe = Join-Path $env:LOCALAPPDATA "$($env:FUNDACAD_PRODUCT)\$($env:FUNDACAD_BIN).exe"
          if ((Test-Path $lnk) -or (Test-Path $exe)) { throw "$env:FUNDACAD_PRODUCT is already installed on this runner" }
          $run = { (Start-Process $setup.FullName -ArgumentList '/P', '/UPDATE' -Wait -PassThru).ExitCode }
          $code = & $run
          if ($code -ne 0) { throw "the first install exited with $code" }
          if (-not (Test-Path $exe)) { throw "the first install left no $exe" }
          if (-not (Test-Path $lnk)) { throw "the first install in update mode made no Start menu entry at $lnk" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $exe) { throw "the Start menu entry starts $target, not $exe" }
          Write-Host "first install: $lnk -> $target"
          Remove-Item $lnk
          $code = & $run
          if ($code -ne 0) { throw "the update exited with $code" }
          if (Test-Path $lnk) { throw 'an update over an install brought back the Start menu entry its user removed' }
          Write-Host 'update over the install: the removed entry stayed removed'

      # A week, the cap tests/build/artifactRetention.test.ts holds, so the
      # beta release can be republished from them by hand. A leg that failed
      # after tauri-action still uploads, for debugging, but under a name the
      # release and build-flatpak never download, so its files are not shipped.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ job.status == 'success' && 'fundacad-bundle' || 'failed-bundle' }}-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/fundacad.exe
            src-tauri/target/release/fundacad-dev.exe
            src-tauri/target/release/bundle/**/*.sig

  # The Linux build as a Flatpak, repackaged from the .deb above. The GNOME
  # runtime carries WebKitGTK and GTK, which the AppImage takes from the system
  # (appimage-unbundle), so this is what runs on NixOS, rpm-ostree and other
  # read-only systems. Manifest: packaging/flatpak/dev.fundacad.app.yml.
  build-flatpak:
    needs: [channel, bundle]
    # On dev another leg's failure does not stop the Linux .deb's Flatpak.
    if: >-
      !cancelled() && (needs.bundle.result == 'success'
        || (needs.channel.outputs.gated == 'false'
            && (needs.bundle.result == 'failure' || needs.bundle.result == 'cancelled')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fundacad-bundle-ubuntu-22.04
          path: linux

      - name: Build the Flatpak
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find linux -name '*.deb' | head -1)
          [ -n "$deb" ] || { echo "::error::no .deb to repackage"; exit 1; }
          v=$(basename "$deb" | sed -n 's/^FundaCAD_\(.*\)_amd64\.deb$/\1/p')
          [ -n "$v" ] || { echo "::error::no version in $deb"; exit 1; }
          cp "$deb" packaging/flatpak/fundacad.deb

          bash scripts/ci-apt-update.sh -qq
          sudo timeout -k 10 900 apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build packaging/flatpak/dev.fundacad.app.yml
          flatpak build-bundle repo "FundaCAD_${v}_x86_64.flatpak" dev.fundacad.app \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

          # Every library the binary links has to come from the runtime; one
          # that does not would be the same bare loader error as the AppImage.
          flatpak install --user -y --noninteractive "FundaCAD_${v}_x86_64.flatpak"
          flatpak run --command=ldd dev.fundacad.app /app/bin/fundacad > ldd.txt
          if grep 'not found' ldd.txt ; then
            echo "::error::the runtime lacks a library the binary needs"; exit 1
          fi
          ls -lh "FundaCAD_${v}_x86_64.flatpak"

      # The installed Flatpak as a user starts it. The sandbox holds only the
      # GNOME runtime and /app, so a library the package lacks fails here.
      - name: Start the Flatpak and build a box
        continue-on-error: ${{ needs.channel.outputs.gated == 'false' }}
        timeout-minutes: 10
        shell: bash
        run: |
          python3 scripts/bundle-smoke.py --work "$RUNNER_TEMP/smoke-flatpak" -- \
            flatpak run --env=FUNDACAD_MCP_MODE=standalone dev.fundacad.app --mcp

      - name: Upload the Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: fundacad-bundle-flatpak
          retention-days: 7
          if-no-files-found: error
          path: FundaCAD_*.flatpak

  # The packages in clean distro containers. The bundle job runs on a runner
  # with every library linux-deps installs, so a wrong Depends (WebKitGTK 4.1,
  # GTK 3, libsoup 3) passes there; here apt has to resolve it from nothing,
  # and the AppImage meets a Fedora that has only python3. Not in the
  # release job's needs: for now a Depends break shows red but does not hold
  # the beta. On dev it also leaves the run green.
  deb-install:
    needs: [channel, bundle]
    if: >-
      !cancelled() && (needs.bundle.result == 'success'
        || (needs.channel.outputs.gated == 'false'
            && (needs.bundle.result == 'failure' || needs.bundle.result == 'cancelled')))
    continue-on-error: ${{ needs.channel.outputs.gated == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            kind: deb
          - image: ubuntu:24.04
            kind: deb
          - image: debian:12
            kind: deb
          - image: fedora:40
            kind: appimage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fundacad-bundle-ubuntu-22.04
          path: linux

      - name: Install ${{ matrix.kind }} in ${{ matrix.image }} and build a box
        shell: bash
        run: |
          set -euo pipefail
          mkdir pkg
          case "${{ matrix.kind }}" in
            deb) find linux -name '*.deb' -exec cp {} pkg/ \; ;;
            appimage) find linux -name '*.AppImage' -exec cp {} pkg/ \; ;;
          esac
          [ -n "$(ls pkg)" ] || { echo "::error::no package in the bundle artifact"; exit 1; }
          docker run --rm -v "$PWD":/w -w /w ${{ matrix.image }} \
            sh scripts/package-install-smoke.sh ${{ matrix.kind }} /w/pkg

  # The rolling "beta" pre-release from main, the rolling "development"
  # pre-release from dev, or a stable release from a tag.
  #
  # Each rolling release has its own concurrency group and its own tag, moved
  # in place, never deleted, so a development run never touches the beta's
  # tag, release or feed. A stable release hangs off the tag that was pushed,
  # and is only marked latest while no higher stable release exists, because
  # stable installs read releases/latest (tauri.stable.conf.json).
  #
  # The updater endpoint is baked into the binary at build time
  # (tauri.conf.json points at beta/latest.json, tauri.dev.conf.json at
  # development/latest.json). Installs of the retired Python
  # engine read the same feed, and 1.0.x is newer than their 0.2.x, so they move
  # to this build too, which is intended. Section 6's own answer, publish no
  # manifest at all, was rejected because a rolling build that cannot roll is
  # one people install once and never update; tests/security/updater.test.ts
  # pins the endpoint.
  #
  # Its own plugin bundles, built by `bundle` from the same commit as the
  # engine whose plugin host runs their geometry components. The app installs
  # plugins from this release (RELEASE_TAG in src/plugins/index.ts).

  release:
    needs: [channel, bundle, build-flatpak]
    # A failed Flatpak leaves it out of the release rather than holding the
    # release back: always() lets this run once build-flatpak has finished
    # either way. On dev a failed bundle leg does the same for its own files,
    # unless the run itself was cancelled. A leg that hits its timeout can
    # report as cancelled while the run is not.
    if: >-
      always() && needs.channel.outputs.release != ''
      && (needs.bundle.result == 'success'
          || (needs.channel.outputs.gated == 'false' && !cancelled()
              && (needs.bundle.result == 'failure' || needs.bundle.result == 'cancelled')))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      # Per tag: a group keeps one pending job and cancels an older pending
      # one, which would drop a stable release when three tags queue up.
      group: release-${{ needs.channel.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ needs.channel.outputs.release }}
      TAG: ${{ needs.channel.outputs.tag }}
      VERSION: ${{ needs.channel.outputs.version }}
      SHA: ${{ needs.channel.outputs.sha }}
      SINCE: ${{ needs.channel.outputs.since }}
    steps:
      # Before download-artifact: actions/checkout cleans the workspace by
      # default and would delete dist/.
      - uses: actions/checkout@v4

      # By pattern, so only this build's installers and bundles reach dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: fundacad-bundle-*
          path: dist

      # One fixed name per platform and format, with no version in it, so every
      # build replaces the same files on the release. The SourceForge mirror
      # copies whatever the release carries, and versioned names piled up there
      # as a new file per build. The version stays in the title and the notes.
      # A signature follows its bundle as <name>.sig. Plugin bundles already
      # have fixed names and are copied as they are.
      - name: Give every asset its fixed name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          : > missing.txt
          put() { # $1 = find pattern under dist, $2 = published name
            local src
            src=$(find dist -type f -name "$1" | head -1)
            [ -n "$src" ] || { echo "NOTE: no $1 in this build, $2 left out"; echo "$2" >> missing.txt; return 0; }
            cp "$src" "release/$2"
            [ ! -f "$src.sig" ] || cp "$src.sig" "release/$2.sig"
            echo "$(basename "$src") -> $2"
          }
          put '*.AppImage'    FundaCAD-linux-x86_64.AppImage
          put '*.deb'         FundaCAD-linux-x86_64.deb
          put '*.rpm'         FundaCAD-linux-x86_64.rpm
          put '*.flatpak'     FundaCAD-linux-x86_64.flatpak
          put '*setup.exe'    FundaCAD-windows-x64-setup.exe
          put '*.msi'         FundaCAD-windows-x64.msi
          put 'fundacad*.exe' FundaCAD-windows-x64-portable.exe
          put '*.dmg'         FundaCAD-macos-arm64.dmg
          put '*.app.tar.gz'  FundaCAD-macos-arm64.app.tar.gz
          find dist -type f -name 'plugin-*.zip' -exec cp {} release/ \;
          ls release/plugin-*.zip >/dev/null 2>&1 || echo 'the plugin bundles' >> missing.txt
          ls -l release

      - name: Assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          d="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "$VERSION" --arg d "$d" '{version:$v, pub_date:$d, platforms:{}}' > latest.json
          add() { # $1 = updater platform key, $2 = updater bundle path
            [ -n "$2" ] && [ -f "$2" ] || { echo "NOTE: no bundle for $1"; return 0; }
            sig="$2.sig"
            [ -f "$sig" ] || { echo "WARNING: $2 has no .sig, $1 left out of latest.json"; return 0; }
            jq --arg k "$1" --arg u "$base/$(basename "$2")" --rawfile s "$sig" \
              '.platforms[$k] = {signature: $s, url: $u}' latest.json > t && mv t latest.json
          }
          add linux-x86_64   release/FundaCAD-linux-x86_64.AppImage
          add windows-x86_64 release/FundaCAD-windows-x64-setup.exe
          add darwin-aarch64 release/FundaCAD-macos-arm64.app.tar.gz  # macos-14 runners are arm64
          cat latest.json

      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          # Every name in release/ is fixed and has no spaces, so plain
          # word-splitting is safe here.
          files=$(find release -type f | sort)
          grep -v '^release/plugin-' <<<"$files" | grep -q . \
            || { echo "::error::no installers to publish"; exit 1; }
          # The plugin bundles this build installs from (RELEASE_TAG in
          # src/plugins/index.ts). Without them every offered plugin is a 404,
          # which on dev a failed Linux leg may leave to the previous build's.
          if [ "$RELEASE" != development ]; then
            grep -q 'plugin-' <<<"$files" \
              || { echo "::error::no plugin bundles to publish"; exit 1; }
          fi
          partial=''
          if [ "$RELEASE" = development ] && [ -s missing.txt ]; then
            partial=$(paste -sd, missing.txt | sed 's/,/, /g')
          fi
          # Updates in place, never delete and recreate: a release that was
          # recreated once stayed gone for two hours.

          # A manifest pointing installed copies at bundles they will reject is
          # worse than none.
          UPSTREAM_PUBKEY='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDUwMkY3MDMzN0E1RUREMUYKUldRZjNWNTZNM0F2VU81ZU9YLzBPdDV6UVdkVklPOWg1S01zdU1lWitDMGR6aFg1cmJoZnYrMWIK'
          pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          platforms=$(jq '.platforms | length' latest.json)
          if [ "$pubkey" = "$UPSTREAM_PUBKEY" ]; then
            echo "::warning::The updater pubkey in tauri.conf.json is still upstream's, so no update this project signs could verify. Publishing the installers WITHOUT latest.json."
            SELF_UPDATES=no
          elif [ "$platforms" -eq 0 ]; then
            echo "::warning::latest.json has no platforms in it (nothing was signed). Publishing the installers without it."
            SELF_UPDATES=no
          else
            SELF_UPDATES=yes
          fi

          R='${{ github.repository }}'
          MAX=25

          # Hand written notes kept in the repo go above the generated part
          # and replace its commit list, so a promotion no longer overwrites
          # them. Without the file the generated notes alone are published.
          NOTES="docs/release-notes/$RELEASE.md"
          if [ -s "$NOTES" ]; then
            { cat "$NOTES"; printf '\n\n---\n\n'; } > notes.md
          else
            : > notes.md
          fi

          # The warning section 6 calls not optional. With hand written notes
          # it follows them, otherwise it comes first because a reader who
          # stops after the first screen has to have read it.
          cat >> notes.md <<'WARN'
          > ### Read this first
          >
          > **This is FundaCAD 1.0 on the Rust geometry engine.** It replaces
          > the Python engine, which is retired.
          >
          > - If a model builds differently here than it did on the Python
          >   engine, a missing or changed face, a fillet that refuses, a
          >   feature the skipped feature banner names, please report it with
          >   the file.
          > - Plugin geometry runs as sandboxed WebAssembly components. Every
          >   plugin in this repository ships one (3D Printing Toolbox, Screws,
          >   Printing, Texture); a third party plugin without one says so by
          >   name when its feature is used.
          > - MCP is part of the app: `fundacad --mcp` is the server for AI
          >   assistants, and Preferences, AI assistants
          >   (MCP) gives the setup for Claude Code, Claude Desktop or any
          >   MCP host. An installed MCP server plugin is removed on first
          >   start.
          > - Documents saved by the Python engine build are ordinary
          >   `.funda` files and open here.

          WARN

          if [ "$RELEASE" = beta ]; then
            printf 'Rolling FundaCAD 1.0 beta (%s), Rust engine, rebuilt from `main` at [`%s`](https://github.com/%s/commit/%s).\n' \
              "$VERSION" "${SHA:0:7}" "$R" "$SHA" >> notes.md
            branch=main
          elif [ "$RELEASE" = development ]; then
            printf 'FundaCAD development build (%s), bleeding edge, rebuilt from `dev` at [`%s`](https://github.com/%s/commit/%s).\n' \
              "$VERSION" "${SHA:0:7}" "$R" "$SHA" >> notes.md
            printf '\nIt has every change as soon as it lands, and it can be broken. The [beta](https://github.com/%s/releases/tag/beta) is the somewhat stable one.\n' "$R" >> notes.md
            branch=dev
          else
            printf 'FundaCAD %s, the stable release, built from `main` at [`%s`](https://github.com/%s/commit/%s).\n' \
              "$VERSION" "${SHA:0:7}" "$R" "$SHA" >> notes.md
            printf '\nThe rolling beta, with the newest changes before they reach a stable release, is [here](https://github.com/%s/releases/tag/beta).\n' "$R" >> notes.md
            prev="$SINCE"
            branch=main
          fi
          if [ ! -s "$NOTES" ]; then
            if [ "$RELEASE" != stable ]; then
              # The commit the rolling tag is on RIGHT NOW: the build this
              # replaces. Read BEFORE the tag is moved, further down.
              prev=$(gh api "repos/$R/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
            fi
            commits=''
            if [ -n "$prev" ] && [ "$prev" != "$SHA" ]; then
              commits=$(gh api "repos/$R/compare/$prev...$SHA" \
                --jq '[.commits[] | select((.parents | length) < 2)] | reverse' 2>/dev/null || true)
            fi
            span="since [\`${prev:0:7}\`](https://github.com/$R/compare/$prev...$SHA)"
            if [ -z "$commits" ] || [ "$(jq 'length' <<<"$commits")" -eq 0 ]; then
              commits=$(gh api "repos/$R/commits?sha=$SHA&per_page=$MAX" \
                --jq '[.[] | select((.parents | length) < 2)]')
              span="the newest on \`$branch\`"
            fi
            total=$(jq 'length' <<<"$commits")

            {
              printf '\n## Changes, %s\n\n' "$span"
              jq -r --arg base "https://github.com/$R/commit/" --argjson max "$MAX" '
                def clip($n): if (length) > $n then (.[0:$n] | sub("\\s+$"; "")) + "…" else . end;
                .[0:$max][]
                | .sha as $sha
                | (.commit.message | split("\n")) as $l
                | ($l[0] | gsub("[\\[\\]]"; "")) as $subject
                | ($l[1:] | map(select(test("\\S"))) | join(" ")
                          | gsub("\\s+"; " ") | gsub("[\\[\\]]"; "")) as $body
                | (($subject | capture("^(?<t>[a-z]+)(\\([^)]*\\))?!?: (?<r>.+)$"))
                    // {t: "commit", r: $subject}) as $c
                | "- " + $c.t + "(`" + $sha[0:7] + "`): ["
                  + ($c.r | clip(90)) + "](" + $base + $sha + ")"
                  + (if ($body | length) == 0 then "" else " " + ($body | clip(160)) end)
              ' <<<"$commits"
              if [ "$total" -gt "$MAX" ]; then
                printf '\nand %d more.\n' "$((total - MAX))"
              fi
            } >> notes.md
          fi

          app=FundaCAD
          [ "$RELEASE" != development ] || app='FundaCAD Dev'
          printf '\n---\n\nUnsigned: Windows SmartScreen needs "More info", then "Run anyway"; macOS may call the app damaged, which `xattr -dr com.apple.quarantine "/Applications/%s.app"` clears. [Install notes](https://github.com/%s#install).\n' \
            "$app" "$R" >> notes.md
          printf '\nThis build carries no Python runtime, so it is a fraction of the size of the Python engine builds.\n' >> notes.md
          if [ -n "$partial" ]; then
            printf '\nNot rebuilt this time, so any copy here is from an earlier build: %s.\n' "$partial" >> notes.md
          fi
          if [ "$SELF_UPDATES" = yes ]; then
            # Betas installed before the signing key changed cannot verify
            # the new key's updates, so hand written notes say who updates.
            [ -s "$NOTES" ] || printf '\nCopies installed before the signing key changed need one manual install of this build, after that they update themselves from the newest %s release.\n' "$RELEASE" >> notes.md
          else
            printf '\nThis build does not update itself, so take a new installer from this page when you want a newer one.\n' >> notes.md
          fi
          if [ "$RELEASE" = beta ]; then
            # The SourceForge mirror's download button, which a hand edit added
            # once and every rebuild of the notes then dropped.
            printf '\n[![Download FundaCAD](https://a.fsdn.com/con/app/sf-download-button)](https://sourceforge.net/projects/fundacad/files/beta/)\n' >> notes.md
          fi
          if [ "$RELEASE" != stable ]; then
            # Move the rolling tag onto this commit (create it if it is missing),
            # so the release attached to it never stops existing. GitHub refuses
            # this token a tag move across a commit that changes a workflow file,
            # so a refused move keeps the old tag and still publishes this build.
            gh api -X PATCH "repos/$R/git/refs/tags/$TAG" -f sha="$SHA" -F force=true \
              || gh api -X POST "repos/$R/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" \
              || { gh api "repos/$R/git/refs/tags/$TAG" >/dev/null 2>&1 \
                     && echo "::warning::the $TAG tag could not move to $SHA (a workflow file changed), the installers are still this build"; } \
              || { echo "::error::the $TAG tag is missing and could not be created. Push it once by hand with a token that may change workflow files: git push origin $SHA:refs/tags/$TAG"; exit 1; }

            if [ "$RELEASE" = beta ]; then
              TITLE='FundaCAD 1.0 beta, Rust engine (rolling)'
            else
              TITLE='FundaCAD 1.0 development build, bleeding edge (rolling)'
            fi
            if gh release view "$TAG" --repo "$R" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "$R" --prerelease \
                --title "$TITLE" --notes-file notes.md
            else
              gh release create "$TAG" --repo "$R" --prerelease \
                --title "$TITLE" --notes-file notes.md
            fi
          else
            TITLE="FundaCAD $TAG"
            # A new release starts as a draft and is published once its assets
            # are up, so releases/latest never names one without installers or
            # a feed.
            if gh release view "$TAG" --repo "$R" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "$R" --title "$TITLE" --notes-file notes.md
            else
              gh release create "$TAG" --repo "$R" --verify-tag --draft --latest=false \
                --title "$TITLE" --notes-file notes.md
            fi
          fi

          # Binaries first, latest.json LAST, so the manifest on the release
          # only ever names files that are already up. The names are fixed, so
          # the binaries replace the ones the old manifest names: take that
          # manifest down first, or an installed copy could fetch the new
          # bytes against the old signature and refuse the update.
          gh release delete-asset "$TAG" latest.json --repo "$R" --yes 2>/dev/null || true
          gh release upload "$TAG" --repo "$R" --clobber $files
          if [ "$SELF_UPDATES" = yes ]; then
            gh release upload "$TAG" --repo "$R" --clobber latest.json
          else
            echo "latest.json withheld (see the warning above); the installers above are complete"
          fi

          # Retire anything this build did not publish: a format dropped from
          # the build, and once, the versioned names from before the fixed ones.
          # A partial development build keeps the earlier build's files instead.
          keep=$(for f in $files latest.json; do basename "$f"; done | sort -u)
          if [ -n "$partial" ]; then
            echo "not every file was rebuilt, so nothing is retired this time"
          else
            gh release view "$TAG" --repo "$R" --json assets -q '.assets[].name' \
              | while read -r asset; do
                  printf '%s\n' "$keep" | grep -qxF "$asset" \
                    || gh release delete-asset "$TAG" "$asset" --repo "$R" --yes || true
                done
          fi

          if [ "$RELEASE" = stable ]; then
            # Worked out here, against the releases published by now, not in
            # `channel`: re-running failed jobs keeps channel's outputs, and a
            # release published since then would be missed. A hotfix to an
            # older line must not become the release every stable install
            # updates to.
            published=$(gh release list --repo "$R" --exclude-drafts --exclude-pre-releases \
              --limit 1000 --json tagName --jq '.[].tagName')
            newest=$(printf '%s\n%s\n' "$published" "$TAG" \
              | grep -E '^v1\.([1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1)
            latest=false
            [ "$newest" != "$TAG" ] || latest=true
            gh release edit "$TAG" --repo "$R" --draft=false --prerelease=false --latest="$latest"
          fi

      # Every beta also stays on as a normal release of its own, v1.0.<run
      # number>, so a version can be linked, downloaded and packaged (Flathub,
      # winget) after the rolling beta has moved on. It carries no latest.json:
      # installed betas keep updating from the rolling feed. It is the repo's
      # latest release only while no stable release exists, because stable
      # installs find their feed through releases/latest.
      - name: Publish this version's own release
        if: needs.channel.outputs.release == 'beta'
        shell: bash
        run: |
          set -euo pipefail
          R='${{ github.repository }}'
          V="v$VERSION"
          sed '0,/^Rolling FundaCAD 1\.0 beta (/s//FundaCAD 1.0 beta (/' notes.md > version-notes.md
          printf '\nThe [rolling beta](https://github.com/%s/releases/tag/beta) always has the newest build.\n' "$R" >> version-notes.md
          stable=$(gh release list --repo "$R" --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName' | grep -E '^v1\.([1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true)
          latest=true
          [ -z "$stable" ] || latest=false
          TITLE="FundaCAD $VERSION beta"
          if gh release view "$V" --repo "$R" >/dev/null 2>&1; then
            gh release edit "$V" --repo "$R" --title "$TITLE" --notes-file version-notes.md
          elif ! gh release create "$V" --repo "$R" --target "$SHA" --draft --latest=false \
              --title "$TITLE" --notes-file version-notes.md; then
            # The same refusal as the rolling tag's: this token may not make a
            # tag on a commit that changes a workflow file. The beta is out.
            echo "::warning::no $V release, its tag could not be made on ${SHA:0:7}; the rolling beta has this build"
            exit 0
          fi
          # Package managers pin a file by its hash, and this release's files never change.
          (cd release && sha256sum $(ls | sort)) | sed 's/ \*/  /' > SHA256SUMS.txt
          files=$(find release -type f | sort)
          gh release upload "$V" --repo "$R" --clobber $files SHA256SUMS.txt
          gh release edit "$V" --repo "$R" --draft=false --prerelease=false --latest="$latest"

  # Browser end-to-end checks for the imported-assembly Browser tree.
  #
  # Deliberately NON-GATING: nothing `needs:` this job, so a browser flake can
  # never block a beta publish. That matters here because a green build
  # auto-publishes to users who auto-update, and browser e2e is the classic
  # flaky surface.
  #
  # The engine is the one `rust-geom` built and tested, handed over as an
  # artifact rather than compiled again with OpenCASCADE here.
  #
  # These exist because everything else about the assembly tree is unit tests and
  # row counts. The render-signature bug (a document whose product NAMES changed
  # while its bodies did not never repainted the panel) passed every unit test and
  # was only caught by looking at the rendered panel.
  #
  # Uses the runner's PREINSTALLED Google Chrome rather than downloading a browser,
  # and installs playwright-core with --no-save so the main build path keeps its
  # dependency set unchanged.
  e2e:
    needs: rust-geom
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm ci
          npm i --no-save playwright-core@1.56.0

      - name: Fetch the engine rust-geom built
        uses: actions/download-artifact@v4
        with:
          name: fundacad-engine-linux
          path: engine-bin

      - name: Start the geometry engine and vite
        run: |
          chmod +x engine-bin/fundacad-engine
          FUNDACAD_ENGINE_PORT=8765 FUNDACAD_ENGINE_TOKEN=citoken \
            engine-bin/fundacad-engine --ws > /tmp/ci_engine.log 2>&1 &
          npx vite --port 5173 > /tmp/ci_vite.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "LISTENING 8765" /tmp/ci_engine.log 2>/dev/null && break
            sleep 2
          done
          grep -q "LISTENING 8765" /tmp/ci_engine.log || { echo "the engine never listened"; cat /tmp/ci_engine.log; exit 1; }

      # e2e/browser_tree_perf.cjs is deliberately NOT run here: it is a
      # benchmark whose verdict compares two medians, and a shared runner's
      # noise can invert that. Run it by hand (see its header).
      - name: Assembly tree end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/assembly_tree_e2e.cjs

      - name: History column end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/history_side_e2e.cjs

      # Starts two engines of its own, so the one above is left alone.
      - name: Browser save keeps imported geometry end-to-end
        env:
          SC_ENGINE: engine-bin/fundacad-engine
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/browser_save_geometry_e2e.cjs /tmp/browser_save_geometry_shots
      - name: Shell never scrolls end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/shell_no_shift_e2e.cjs

      # SwiftShader runs the low power tier, so the check turns the shadow map back on itself.
      - name: First stress result drawn in Matcap end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/matcap_first_stress_e2e.cjs

      # Builds only the small frames crate and tungstenite, no Tauri, no kernel.
      - name: Native frames over WebSocket end-to-end
        env:
          SC_CHROME: /usr/bin/google-chrome
          CARGO_TARGET_DIR: ${{ runner.temp }}/frames-target
        run: |
          cargo build --release --example frames_serve --manifest-path src-tauri/frames/Cargo.toml
          node e2e/frames_ws_e2e.cjs

      # lavapipe is Mesa's CPU Vulkan driver, so the image tests trace on the
      # runner instead of skipping. They still skip when no adapter fits.
      - name: Install a software Vulkan driver
        run: sudo timeout -k 10 600 apt-get install -y mesa-vulkan-drivers

      - name: Native tracer tests
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/frames-target
          FUNDACAD_TRACER_ALLOW_CPU: "1"
        run: cargo test --manifest-path src-tauri/tracer/Cargo.toml -- --test-threads=4

      # The traced bloom checks on lavapipe, through tracer_serve outside the
      # app. A smaller page keeps 256 software samples well inside the wait.
      - name: Native tracer bloom end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
          SC_TRACER: native-dev
          SC_VIEWPORT: 800x560
          CARGO_TARGET_DIR: ${{ runner.temp }}/frames-target
          FUNDACAD_TRACER_ALLOW_CPU: "1"
        run: |
          cargo build --release --example tracer_serve --manifest-path src-tauri/tracer/Cargo.toml
          node e2e/pathtrace_bloom_e2e.cjs /tmp/pathtrace_bloom_shots

      # The agent harness starts its own engine, vite and Chrome on free ports,
      # so the engine and vite above are left alone.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Agent harness unit tests
        run: |
          pip install -e "tools/harness[test]"
          python -m pytest tools/harness/tests/unit -q

      - name: Agent harness smoke set
        env:
          FUNDACAD_ENGINE_CMD: ${{ github.workspace }}/engine-bin/fundacad-engine
          FUNDACAD_CHROME: /usr/bin/google-chrome
          FUNDACAD_HARNESS_KEEP: "1"
          TMPDIR: ${{ runner.temp }}/harness
        run: |
          mkdir -p "$TMPDIR"
          python -m pytest tools/harness/tests -m "smoke and not a11y" -q

      - name: Agent harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs
          path: ${{ runner.temp }}/harness
          if-no-files-found: ignore
          retention-days: 7

      # The axe baseline was seeded on Windows Chrome, so this stays
      # continue-on-error until wave 1 of the accessibility epic has landed.
      - name: Accessibility smoke (axe and aria snapshots)
        continue-on-error: true
        timeout-minutes: 10
        env:
          FUNDACAD_ENGINE_CMD: ${{ github.workspace }}/engine-bin/fundacad-engine
          FUNDACAD_CHROME: /usr/bin/google-chrome
          FUNDACAD_HARNESS_KEEP: "1"
          FUNDACAD_A11Y_OUT: ${{ runner.temp }}/a11y/out
          TMPDIR: ${{ runner.temp }}/a11y/harness
        run: |
          mkdir -p "$TMPDIR" "$FUNDACAD_A11Y_OUT"
          python -m pytest tools/harness/tests -m a11y -q

      - name: Accessibility smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-smoke
          path: ${{ runner.temp }}/a11y
          if-no-files-found: ignore
          retention-days: 7

      - name: Engine log on failure
        if: failure()
        run: tail -50 /tmp/ci_engine.log /tmp/ci_vite.log || true

  # The native tracer on Metal. A macOS app always traces natively, since its
  # WKWebView has no WebGPU, and the macos-14 runner is an Apple Silicon VM
  # with the same Apple Paravirtual device a Mac VM user has. Every image test
  # passes by skipping when no adapter fits, so a skip fails the job here.
  # continue-on-error until it has passed once.
  tracer-macos:
    runs-on: macos-14
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref_type != 'tag' }}

      # log_file.rs has no dependencies, so its macOS redirect builds and runs
      # alone, without the app and its OpenCASCADE.
      - name: macOS log file tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition 2021 --test -D warnings src-tauri/tests/unit/log_file.rs -o "$RUNNER_TEMP/log_file_test"
          "$RUNNER_TEMP/log_file_test"

      - name: Native tracer tests on Metal
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cargo test --locked --manifest-path src-tauri/tracer/Cargo.toml -- --test-threads=4 --nocapture 2>&1 | tee "$RUNNER_TEMP/tracer.log" || status=$?
          grep -E "^[A-Za-z]+ on .*\(" "$RUNNER_TEMP/tracer.log" | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          # Ray queries and the OIDN archive may be missing on this runner, so
          # those skips are listed but do not fail the job.
          if grep -E "skipped[,:] no ray quer|skipped, FUNDACAD_OIDN_ARCHIVE" "$RUNNER_TEMP/tracer.log" | sort -u | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::some tracer tests skipped on this runner, see the job summary"
          fi
          if grep -E "skipped[,:] no (GPU )?adapter" "$RUNNER_TEMP/tracer.log"; then
            echo "::error::the tracer tests found no Metal adapter and skipped"
            exit 1
          fi
          exit "$status"

      - name: Tracer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracer-macos-log
          path: ${{ runner.temp }}/tracer.log
          if-no-files-found: ignore
          retention-days: 7

  # The geometry engine (crates/, docs/ENGINE.md) and the app shell around
  # it. It compiles OpenCASCADE 7.8.1 from source through the occt-sys crate,
  # which is long on a cold runner and short once target/OCCT is cached, so the
  # static kernel gets its own cache keyed on the crate that builds it. It gates
  # the beta and stable builds, not the development one: red here means the
  # engine is broken.
  rust-geom:
    # The self hosted runner keeps its target dir between runs, so only what
    # changed recompiles. Only the owner's own pushes and manual runs go there,
    # everyone else gets GitHub's runner; the runner's job-started hook refuses
    # anything else too, since a fork pull request could edit this file.
    # vars.FAST_RUNNER off falls back to GitHub.
    runs-on: ${{ (github.event_name != 'pull_request' && github.actor == 'Paraxdev' && github.triggering_actor == 'Paraxdev' && vars.FAST_RUNNER == 'true') && fromJSON('["self-hosted","fundacad"]') || 'ubuntu-22.04' }}
    timeout-minutes: 240
    permissions:
      contents: read
    # Every test binary links the static OpenCASCADE, so full debug info filled
    # the runner's disk once the import suites grew. Line tables keep file:line
    # in panics.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SELF_HOSTED: ${{ github.event_name != 'pull_request' && github.actor == 'Paraxdev' && github.triggering_actor == 'Paraxdev' && vars.FAST_RUNNER == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A clean checkout would delete the warm target dir.
          clean: ${{ env.SELF_HOSTED != 'true' }}

      - name: Free disk space
        if: env.SELF_HOSTED != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # src-tauri links the tauri crate, which needs the webkit2gtk stack and
      # libudev; cmake builds OpenCASCADE.
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install cmake
        run: sudo apt-get install -y cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Cargo
        if: env.SELF_HOSTED != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
          save-if: ${{ github.ref_type != 'tag' }}

      # The same kernel and key as bundle's, so the two jobs share it. Keep
      # it after rust-cache, see bundle.
      - name: Cache the static OpenCASCADE build
        if: env.SELF_HOSTED != 'true'
        uses: actions/cache@v4
        with:
          path: |
            target/OCCT
            !target/OCCT/build
          key: occt-static-${{ runner.os }}-${{ hashFiles('third_party/opencascade-rs/crates/occt-sys/src/lib.rs', 'third_party/opencascade-rs/crates/opencascade-sys/build.rs', 'third_party/opencascade-rs/crates/opencascade-sys/Cargo.toml') }}

      # The whole workspace, not the kernel crate alone: the engine's request
      # loop, its transports and the protocol have tests of their own, and the
      # WebSocket transport is behind a feature, so without it the server the
      # browser and the e2e scripts talk to is never compiled here. It also
      # covers fundacad-mcp, whose suites drive the built
      # binaries rather than the library: the MCP server over its real stdio
      # protocol, and `fundacad-engine` over a real socket for the live session.
      # The plugin host suites load each plugin's built component and skip
      # without it, and the MCP suites drive the built engine binary, so both
      # are built first or those tests pass without testing anything.
      - name: Build the plugin components
        run: python3 scripts/build-plugin-wasm.py

      - name: Build the workspace binaries
        run: cargo build --workspace --features fundacad-engine/ws

      - name: Rust workspace tests
        run: cargo test --workspace --features fundacad-engine/ws

      # Text outlines come from the system's fonts, and the text goldens were
      # frozen with Windows' Arial and Times New Roman. A case whose font is
      # not installed is skipped rather than compared with a stand in.
      - name: Install the fonts the text goldens were frozen with
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer

      # Parity with the retired sidecar: every corpus rebuilt on this
      # engine and compared with the sidecar's frozen answers in
      # tests/golden (docs/ENGINE.md, "Golden files"). The MCP transcript is
      # crates/fundacad-mcp/tests/parity_golden.rs, run by the step above. Every
      # golden runs even after one fails, so a red build names them all.
      - name: Golden parity checks
        shell: bash
        run: |
          fail=0
          for g in tests/golden/*.golden.json; do
            case "$g" in *mcp_parity*) continue ;; esac
            # The engine's progress lines go to stderr; kept for a failure only.
            ./target/debug/fundacad-engine golden-check "$g" 2>golden.err \
              || { echo "::error::$g does not match its golden answers"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # The same answers from a warm disk cache: a first process checkpoints
      # every build, a second reopens every document from those checkpoints, as
      # the app does after a restart. The goldens whose documents run plugin
      # features, where state that is not in the shape has to survive the disk.
      - name: Golden parity checks, warm cache
        shell: bash
        run: |
          fail=0
          for g in texture plugins screws_ops; do
            ./target/debug/fundacad-engine golden-check "tests/golden/$g.golden.json" --warm 2>golden.err \
              || { echo "::error::$g does not match its golden answers from a warm cache"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # The app shell, including tests/container_seam.rs: an import the engine
      # stored survives the app's container into a fresh blob store and
      # rebuilds there. Links the kernel this job already built, and a `dist`
      # stands in for the frontend, which the Tauri context embeds.
      - name: App shell tests (unit + container seam)
        working-directory: src-tauri
        run: |
          mkdir -p ../dist
          cargo test --tests --workspace

      - name: Upload the engine for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: fundacad-engine-linux
          retention-days: 1
          if-no-files-found: error
          path: target/debug/fundacad-engine

      # The shipped engine is an optimised GCC build, which the debug build above
      # is not: undefined behaviour in the C++ shims has shown up only there. The
      # same goldens again on a release build, each under a clock, so a result
      # that differs or a rebuild that hangs only once optimised fails here. A
      # release build finds plugins only through FUNDACAD_PLUGIN_DIR.
      - name: Build the release engine
        run: cargo build --release -p fundacad-cli

      - name: Golden parity checks, release build
        shell: bash
        env:
          FUNDACAD_PLUGIN_DIR: plugins
        run: |
          fail=0
          for g in tests/golden/*.golden.json; do
            case "$g" in *mcp_parity*) continue ;; esac
            code=0
            timeout 900 ./target/release/fundacad-engine golden-check "$g" 2>golden.err || code=$?
            [ $code -eq 124 ] && echo "::error::$g did not finish in 15 minutes on the release build"
            [ $code -ne 0 ] && { echo "::error::$g fails on the release build"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # The warm target dir gains a test binary per change; a week is kept.
      - name: Prune the warm target dir
        if: always() && env.SELF_HOSTED == 'true'
        run: |
          find target src-tauri/target -path '*/deps/*' -type f -mtime +7 -delete 2>/dev/null || true
          find target src-tauri/target -path '*/incremental/*' -mtime +7 -delete 2>/dev/null || true
          df -h . | tail -n 1
