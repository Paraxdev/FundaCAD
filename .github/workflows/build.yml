# Cross-platform build + bundle for FundaCAD 1.0 beta: Tauri 2 around the Rust
# geometry engine (docs/ENGINE.md), which runs as a worker process of the
# same executable.
#
# No SYSTEM OpenCASCADE anywhere, on any platform: the occt-sys crate carries
# the 7.8.1 sources and builds them statically into the binary. So this
# workflow has no brew, vcpkg or apt OCCT step.
#
# `build-beta` + `release-beta` publish the rolling `beta` release and its
# update feed from `main`. The retired Python engine is frozen on the `legacy`
# branch, whose last build is the `legacy-final` release.
#
# Scope: x86_64 Linux, Apple Silicon macOS, x86_64 Windows. (No Intel-mac / linux-arm64.)

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Gates the build matrix with the frontend checks, BEFORE any installer is
  # built. Runs once on Linux only. The engine's own tests are `rust-geom`,
  # which gates the build too.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Cheapest gate first: refuse agent/editor session artifacts and hardcoded
      # developer paths before spending 18 minutes on installers. This is a public
      # repo, .claude/settings.json and a home-directory layout both reached it
      # once already, and .gitignore can't catch an already-tracked path.
      - name: Repo hygiene
        run: sh scripts/check-repo-hygiene.sh

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests (vitest)
        run: npx vitest run

      # The plugin sandbox is a worker ENTRY, so Rollup treats its exports as
      # unreachable and drops them. That produced a chunk with none of the
      # sandbox in it, past every unit test, and would have failed at the first
      # line of the first plugin anyone ran. Only the built artifact shows it.
      - name: Plugin sandbox chunk survives the build
        run: node scripts/check-sandbox-chunk.mjs

      # The app ships the loader and nothing to load. What makes that true is one
      # `import.meta.env.DEV` branch in src/plugins/activate.ts, which vite
      # replaces with `false` so rollup drops the branch, the dynamic import
      # inside it, and src/plugins/devPlugins.ts with its glob of every plugin
      # directory. Nothing fails loudly if that branch is ever written a way
      # rollup cannot drop: the app keeps working, the plugins keep running from
      # the bundle, and "we do not ship them" becomes a claim rather than a fact.
      # Reads the artifact check-sandbox-chunk.mjs has just built.
      - name: The app ships no plugin code
        run: node scripts/check-no-plugin-code.mjs

  # The beta build (docs/ENGINE.md section 6), on three platforms. The
  # engine is a worker process of the same executable, and there is no Python
  # in the bundle at all.
  #
  # Pushes and dispatches only, never a pull request. OpenCASCADE 7.8.1 is
  # compiled from source into the binary on each platform, twenty minutes cold,
  # and a pull request is already told whether the engine compiles by the
  # `rust-geom` job.
  build-beta:
    needs: [test, rust-geom]
    permissions:
      contents: write # tauri-action may attach artifacts to a draft release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-14 # Apple Silicon (arm64) runner
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        # third_party/opencascade-rs is vendored in-repo (no submodules), and
        # this build DOES compile it, so a plain checkout is still enough.

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/linux-deps

      # The one thing linux-deps leaves out, for the OpenCASCADE build.
      - name: Install cmake (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get install -y cmake

      # appimagetool downloads the AppImage runtime from GitHub on every run,
      # once, with no retry, and a single 500 from GitHub failed the whole
      # Linux build. Fetch it here with retries and hand it to both packers:
      # linuxdeploy's AppImage plugin reads LDAI_RUNTIME_FILE, and
      # appimage-unbundle passes it to appimagetool as --runtime-file.
      - name: Fetch the AppImage runtime (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          rt="$RUNNER_TEMP/runtime-x86_64"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$rt" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          test -s "$rt"
          echo "LDAI_RUNTIME_FILE=$rt" >> "$GITHUB_ENV"

      # wasm32-wasip2 for the plugin geometry components packed below.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # The root workspace too: fundacad-mcp is built there.
      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            . -> target
          key: alpha

      # The kernel is installed into target/OCCT at the repo root (the root
      # .cargo/config.toml sets FUNDACAD_OCCT_ROOT, src-tauri reads it too),
      # which rust-cache does not keep. Without this every run pays the twenty
      # minute OCCT build again on every platform. Only the install is kept,
      # the build tree beside it is two thirds of the size and never read once
      # the install is there.
      #
      # Keyed on the three files that decide what gets built, NOT on Cargo.lock:
      # the kernel does not change when some unrelated crate is bumped, and a
      # key that moved with the lock would throw the build away most weeks.
      #
      # Keep this step after rust-cache: post steps run in reverse, so this one
      # saves before rust-cache's cleanup, which takes target/OCCT for a profile
      # dir and deletes its lib, include and cmake.
      - name: Cache the static OpenCASCADE build
        uses: actions/cache@v4
        with:
          path: |
            target/OCCT
            !target/OCCT/build
          key: occt-static-${{ runner.os }}-${{ hashFiles('third_party/opencascade-rs/crates/occt-sys/src/lib.rs', 'third_party/opencascade-rs/crates/opencascade-sys/build.rs', 'third_party/opencascade-rs/crates/opencascade-sys/Cargo.toml') }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # The bundle configs declare no resources, so nothing beside the
      # executable and the MCP server can end up in the bundle by accident.
      - name: The bundle declares no resources
        shell: bash
        run: |
          node -e "
            for (const f of ['./src-tauri/tauri.conf.json', './src-tauri/tauri.beta.conf.json']) {
              if (require(f).bundle.resources) { console.error(f + ' bundles resources'); process.exit(1); }
            }
          "

      # Rolling beta versioning, 1.0.<run_number>: the Rust engine is the
      # major upgrade, against the retired Python engine's 0.2.
      #
      # No `-beta` suffix: tauri's msi target refuses a version whose
      # pre-release identifier is not numeric ("optional pre-release identifier
      # in app version must be numeric-only"), so it fails the Windows leg
      # outright and NSIS silently rewrites it to 0 in VIProductVersion. The
      # tag, the title and the update feed say beta instead.
      - name: Stamp rolling version
        shell: bash
        run: |
          v="1.0.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version='$v';fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "stamped $v"

      - name: Disable updater artifacts when they could not be trusted
        uses: ./.github/actions/updater-artifacts
        with:
          config: src-tauri/tauri.beta.conf.json
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Plugin bundles for this release, built from the same commit as the
      # engine that runs their components. Once, not per platform: a bundle is
      # the same bytes whoever builds it.
      - name: Package the plugins
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-plugins.py dist-plugins
          want=$(ls -d plugins/*/manifest.json | wc -l)
          got=$(ls dist-plugins/plugin-*.zip | wc -l)
          if [ "$want" != "$got" ]; then
            echo "packaged $got bundles for $want plugin directories" >&2
            exit 1
          fi
          # A plugin that names a component and ships without it would install
          # and then refuse every feature it declares.
          for m in plugins/*/manifest.json; do
            wasm=$(node -p "require('./$m').geometryWasm || ''")
            [ -n "$wasm" ] || continue
            id=$(node -p "require('./$m').id")
            unzip -l "dist-plugins/plugin-$id.zip" | grep -q " $wasm\$" \
              || { echo "::error::plugin-$id.zip has no $wasm"; exit 1; }
          done

      - name: Upload plugin bundles
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: fundacad-beta-plugins
          retention-days: 7
          if-no-files-found: error
          path: dist-plugins/plugin-*.zip

      # --- build + bundle. The app also exposes the MCP server through its
      #     --mcp mode. ---
      - name: Build + bundle Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # CMake 4 refuses OCCT 7.8.1's declared minimum. Harmless on a runner
          # still shipping CMake 3, and the day one moves this is why it builds.
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          NO_STRIP: true
        with:
          args: --verbose --config src-tauri/tauri.beta.conf.json

      # Checked against the bytes rather than the arguments: `engine_attach` is
      # the IPC command the webview reaches the engine through
      # (src-tauri/src/lib.rs), and it is also what fundacad-mcp looks for to
      # recognise an app it can start as its engine.
      - name: The shipped binary carries the engine
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find src-tauri/target/release -maxdepth 1 -type f \( -name fundacad -o -name fundacad.exe \) | head -1)
          [ -n "$bin" ] || { echo "::error::no fundacad binary was produced"; exit 1; }
          node -e "
            const fs = require('fs');
            const hay = fs.readFileSync(process.argv[1]);
            if (hay.indexOf(Buffer.from('engine_attach')) < 0) {
              console.error('::error::the binary registers no engine_attach command, so the webview cannot reach the engine');
              process.exit(1);
            }
            console.log('engine_attach found');
          " "$bin"
          node -e "
            const fs = require('fs');
            const hay = fs.readFileSync(process.argv[1]);
            if (hay.indexOf(Buffer.from('the stdio transport failed')) < 0) {
              console.error('::error::the binary carries no MCP stdio server');
              process.exit(1);
            }
            console.log('MCP stdio server found');
          " "$bin"

      - name: Un-bundle the system stack from the AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/appimage-unbundle
        with:
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Depend on the renamed GTK package (deb)
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/deb-gtk-depends

      # A week, the cap tests/build/artifactRetention.test.ts holds, so the
      # beta release can be republished from them by hand.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundacad-beta-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/fundacad.exe
            src-tauri/target/release/bundle/**/*.sig

  # The Linux build as a Flatpak, repackaged from the .deb above. The GNOME
  # runtime carries WebKitGTK and GTK, which the AppImage takes from the system
  # (appimage-unbundle), so this is what runs on NixOS, rpm-ostree and other
  # read-only systems. Manifest: packaging/flatpak/dev.fundacad.app.yml.
  build-flatpak:
    needs: build-beta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fundacad-beta-ubuntu-22.04
          path: linux

      - name: Build the Flatpak
        shell: bash
        run: |
          set -euo pipefail
          deb=$(find linux -name '*.deb' | head -1)
          [ -n "$deb" ] || { echo "::error::no .deb to repackage"; exit 1; }
          v=$(basename "$deb" | sed -n 's/^FundaCAD_\(.*\)_amd64\.deb$/\1/p')
          [ -n "$v" ] || { echo "::error::no version in $deb"; exit 1; }
          cp "$deb" packaging/flatpak/fundacad.deb

          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build packaging/flatpak/dev.fundacad.app.yml
          flatpak build-bundle repo "FundaCAD_${v}_x86_64.flatpak" dev.fundacad.app \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

          # Every library the binary links has to come from the runtime; one
          # that does not would be the same bare loader error as the AppImage.
          flatpak install --user -y --noninteractive "FundaCAD_${v}_x86_64.flatpak"
          flatpak run --command=ldd dev.fundacad.app /app/bin/fundacad > ldd.txt
          if grep 'not found' ldd.txt ; then
            echo "::error::the runtime lacks a library the binary needs"; exit 1
          fi
          ls -lh "FundaCAD_${v}_x86_64.flatpak"

      - name: Upload the Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: fundacad-beta-flatpak
          retention-days: 7
          if-no-files-found: error
          path: FundaCAD_*.flatpak

  # Rolling "beta" pre-release, the Rust engine.
  #
  # Its own concurrency group and its own tag, moved in place, never deleted.
  #
  # The updater endpoint is baked into the binary at build time
  # (tauri.conf.json points at beta/latest.json). Installs of the retired Python
  # engine read the same feed, and 1.0.x is newer than their 0.2.x, so they move
  # to this build too, which is intended. Section 6's own answer, publish no
  # manifest at all, was rejected because a rolling build that cannot roll is
  # one people install once and never update; tests/security/updater.test.ts
  # pins the endpoint.
  #
  # Its own plugin bundles, built by build-beta from the same commit as the
  # engine whose plugin host runs their geometry components. The app installs
  # plugins from this release (RELEASE_TAG in src/plugins/index.ts).
  #
  # The retired `alpha` release is kept for a transition period and gets a copy
  # of this release's latest.json, see the end of the publish step.
  release-beta:
    needs: [build-beta, build-flatpak]
    # A failed Flatpak leaves it out of the release rather than holding the
    # release back: always() lets this run once build-flatpak has finished
    # either way.
    if: >-
      always() && needs.build-beta.result == 'success'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-beta
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Before download-artifact: actions/checkout cleans the workspace by
      # default and would delete dist/.
      - uses: actions/checkout@v4

      # By pattern, so only this build's installers and bundles reach dist/.
      - uses: actions/download-artifact@v4
        with:
          pattern: fundacad-beta-*
          path: dist

      # One fixed name per platform and format, with no version in it, so every
      # build replaces the same files on the release. The SourceForge mirror
      # copies whatever the release carries, and versioned names piled up there
      # as a new file per build. The version stays in the title and the notes.
      # A signature follows its bundle as <name>.sig. Plugin bundles already
      # have fixed names and are copied as they are.
      - name: Give every asset its fixed name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          put() { # $1 = find pattern under dist, $2 = published name
            local src
            src=$(find dist -type f -name "$1" | head -1)
            [ -n "$src" ] || { echo "NOTE: no $1 in this build, $2 left out"; return 0; }
            cp "$src" "release/$2"
            [ ! -f "$src.sig" ] || cp "$src.sig" "release/$2.sig"
            echo "$(basename "$src") -> $2"
          }
          put '*.AppImage'    FundaCAD-linux-x86_64.AppImage
          put '*.deb'         FundaCAD-linux-x86_64.deb
          put '*.rpm'         FundaCAD-linux-x86_64.rpm
          put '*.flatpak'     FundaCAD-linux-x86_64.flatpak
          put '*setup.exe'    FundaCAD-windows-x64-setup.exe
          put '*.msi'         FundaCAD-windows-x64.msi
          put 'fundacad.exe'  FundaCAD-windows-x64-portable.exe
          put '*.dmg'         FundaCAD-macos-arm64.dmg
          put '*.app.tar.gz'  FundaCAD-macos-arm64.app.tar.gz
          find dist -type f -name 'plugin-*.zip' -exec cp {} release/ \;
          ls -l release

      - name: Assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          v="1.0.${{ github.run_number }}"
          base="https://github.com/${{ github.repository }}/releases/download/beta"
          d="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg v "$v" --arg d "$d" '{version:$v, pub_date:$d, platforms:{}}' > latest.json
          add() { # $1 = updater platform key, $2 = updater bundle path
            [ -n "$2" ] && [ -f "$2" ] || { echo "NOTE: no bundle for $1"; return 0; }
            sig="$2.sig"
            [ -f "$sig" ] || { echo "WARNING: $2 has no .sig, $1 left out of latest.json"; return 0; }
            jq --arg k "$1" --arg u "$base/$(basename "$2")" --rawfile s "$sig" \
              '.platforms[$k] = {signature: $s, url: $u}' latest.json > t && mv t latest.json
          }
          add linux-x86_64   release/FundaCAD-linux-x86_64.AppImage
          add windows-x86_64 release/FundaCAD-windows-x64-setup.exe
          add darwin-aarch64 release/FundaCAD-macos-arm64.app.tar.gz  # macos-14 runners are arm64
          cat latest.json

      - name: Publish rolling beta release
        shell: bash
        run: |
          set -euo pipefail
          # Every name in release/ is fixed and has no spaces, so plain
          # word-splitting is safe here.
          files=$(find release -type f | sort)
          # The plugin bundles this build installs from (RELEASE_TAG in
          # src/plugins/index.ts). Without them every offered plugin is a 404.
          grep -q 'plugin-' <<<"$files" \
            || { echo "::error::no plugin bundles to publish"; exit 1; }
          # Updates in place, never delete and recreate: a release that was
          # recreated once stayed gone for two hours.

          # A manifest pointing installed copies at bundles they will reject is
          # worse than none.
          UPSTREAM_PUBKEY='dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDUwMkY3MDMzN0E1RUREMUYKUldRZjNWNTZNM0F2VU81ZU9YLzBPdDV6UVdkVklPOWg1S01zdU1lWitDMGR6aFg1cmJoZnYrMWIK'
          pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          platforms=$(jq '.platforms | length' latest.json)
          if [ "$pubkey" = "$UPSTREAM_PUBKEY" ]; then
            echo "::warning::The updater pubkey in tauri.conf.json is still upstream's, so no update this project signs could verify. Publishing the installers WITHOUT latest.json."
            SELF_UPDATES=no
          elif [ "$platforms" -eq 0 ]; then
            echo "::warning::latest.json has no platforms in it (nothing was signed). Publishing the installers without it."
            SELF_UPDATES=no
          else
            SELF_UPDATES=yes
          fi

          R='${{ github.repository }}'
          SHA='${{ github.sha }}'
          MAX=25

          # The warning section 6 calls not optional, and it comes first
          # because a reader who stops after the first screen has to have read
          # it.
          cat > notes.md <<'WARN'
          > ### Read this first
          >
          > **This is FundaCAD 1.0 on the Rust geometry engine.** It replaces
          > the Python engine, which is retired. Its last build stays on the
          > [legacy-final](https://github.com/Paraxdev/fundacad/releases/tag/legacy-final)
          > release and is no longer updated.
          >
          > - If a model builds differently here than it did on the Python
          >   engine, a missing or changed face, a fillet that refuses, a
          >   feature the skipped feature banner names, please report it with
          >   the file.
          > - Plugin geometry runs as sandboxed WebAssembly components. Every
          >   plugin in this repository ships one (3D Printing Toolbox, Screws,
          >   Printing, Texture); a third party plugin without one says so by
          >   name when its feature is used.
          > - MCP is part of the app: `fundacad --mcp` is the server for AI
          >   assistants, and Preferences, AI assistants
          >   (MCP) gives the setup for Claude Code, Claude Desktop or any
          >   MCP host. An installed MCP server plugin is removed on first
          >   start.
          > - Files open in both: documents saved here are ordinary `.funda`
          >   files and open in the Python engine build, and the other way
          >   round.

          WARN

          printf 'Rolling FundaCAD 1.0 beta (1.0.%s), Rust engine, rebuilt from `main` at [`%s`](https://github.com/%s/commit/%s).\n' \
            '${{ github.run_number }}' "${SHA:0:7}" "$R" "$SHA" >> notes.md

          # The commit the rolling tag is on RIGHT NOW: the build this replaces.
          # Read BEFORE the tag is moved, further down.
          prev=$(gh api "repos/$R/git/ref/tags/beta" --jq .object.sha 2>/dev/null || true)
          commits=''
          if [ -n "$prev" ] && [ "$prev" != "$SHA" ]; then
            commits=$(gh api "repos/$R/compare/$prev...$SHA" \
              --jq '[.commits[] | select((.parents | length) < 2)] | reverse' 2>/dev/null || true)
          fi
          span="since [\`${prev:0:7}\`](https://github.com/$R/compare/$prev...$SHA)"
          if [ -z "$commits" ] || [ "$(jq 'length' <<<"$commits")" -eq 0 ]; then
            commits=$(gh api "repos/$R/commits?sha=$SHA&per_page=$MAX" \
              --jq '[.[] | select((.parents | length) < 2)]')
            span="the newest on \`main\`"
          fi
          total=$(jq 'length' <<<"$commits")

          {
            printf '\n## Changes, %s\n\n' "$span"
            jq -r --arg base "https://github.com/$R/commit/" --argjson max "$MAX" '
              def clip($n): if (length) > $n then (.[0:$n] | sub("\\s+$"; "")) + "…" else . end;
              .[0:$max][]
              | .sha as $sha
              | (.commit.message | split("\n")) as $l
              | ($l[0] | gsub("[\\[\\]]"; "")) as $subject
              | ($l[1:] | map(select(test("\\S"))) | join(" ")
                        | gsub("\\s+"; " ") | gsub("[\\[\\]]"; "")) as $body
              | (($subject | capture("^(?<t>[a-z]+)(\\([^)]*\\))?!?: (?<r>.+)$"))
                  // {t: "commit", r: $subject}) as $c
              | "- " + $c.t + "(`" + $sha[0:7] + "`): ["
                + ($c.r | clip(90)) + "](" + $base + $sha + ")"
                + (if ($body | length) == 0 then "" else " " + ($body | clip(160)) end)
            ' <<<"$commits"
            if [ "$total" -gt "$MAX" ]; then
              printf '\nand %d more.\n' "$((total - MAX))"
            fi
          } >> notes.md

          printf '\n---\n\nUnsigned: Windows SmartScreen needs "More info", then "Run anyway"; macOS may call the app damaged, which `xattr -dr com.apple.quarantine /Applications/FundaCAD.app` clears. [Install notes](https://github.com/%s#install).\n' \
            "$R" >> notes.md
          printf '\nThis build carries no Python runtime, so it is a fraction of the size of the Python engine builds.\n' >> notes.md
          if [ "$SELF_UPDATES" = yes ]; then
            printf '\nInstalled copies update themselves from this release, copies of the retired alpha included.\n' >> notes.md
          else
            printf '\nThis build does not update itself, so take a new installer from this page when you want a newer one.\n' >> notes.md
          fi
          # The SourceForge mirror's download button, which a hand edit added
          # once and every rebuild of the notes then dropped.
          printf '\n[![Download FundaCAD](https://a.fsdn.com/con/app/sf-download-button)](https://sourceforge.net/projects/fundacad/files/beta/)\n' >> notes.md

          # Move the rolling tag onto this commit (create it if it is missing),
          # so the release attached to it never stops existing. GitHub refuses
          # this token a tag move across a commit that changes a workflow file,
          # so a refused move keeps the old tag and still publishes this build.
          gh api -X PATCH "repos/$R/git/refs/tags/beta" -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$R/git/refs" -f ref=refs/tags/beta -f sha="$SHA" \
            || { gh api "repos/$R/git/refs/tags/beta" >/dev/null 2>&1 \
                   && echo "::warning::the beta tag could not move to $SHA (a workflow file changed), the installers are still this build"; } \
            || { echo "::error::the beta tag is missing and could not be created"; exit 1; }

          TITLE='FundaCAD 1.0 beta, Rust engine (rolling)'
          if gh release view beta --repo "$R" >/dev/null 2>&1; then
            gh release edit beta --repo "$R" --prerelease \
              --title "$TITLE" --notes-file notes.md
          else
            gh release create beta --repo "$R" --prerelease \
              --title "$TITLE" --notes-file notes.md
          fi

          # Binaries first, latest.json LAST, so the manifest on the release
          # only ever names files that are already up. The names are fixed, so
          # the binaries replace the ones the old manifest names: take that
          # manifest down first, or an installed copy could fetch the new
          # bytes against the old signature and refuse the update.
          for rel in beta alpha; do
            gh release delete-asset "$rel" latest.json --repo "$R" --yes 2>/dev/null || true
          done
          gh release upload beta --repo "$R" --clobber $files
          if [ "$SELF_UPDATES" = yes ]; then
            gh release upload beta --repo "$R" --clobber latest.json
          else
            echo "latest.json withheld (see the warning above); the installers above are complete"
          fi

          # Retire anything this build did not publish: a format dropped from
          # the build, and once, the versioned names from before the fixed ones.
          keep=$(for f in $files latest.json; do basename "$f"; done | sort -u)
          gh release view beta --repo "$R" --json assets -q '.assets[].name' \
            | while read -r asset; do
                printf '%s\n' "$keep" | grep -qxF "$asset" \
                  || gh release delete-asset beta "$asset" --repo "$R" --yes || true
              done

          # Transition mirror for the retired `alpha` channel. Copies built
          # before the rename read alpha/latest.json and install plugins from
          # the alpha release, so that release is left as it is and only gets
          # this same manifest, whose URLs and signatures name this beta
          # release's assets. An alpha copy updates into a build that reads the
          # beta feed, and never needs the alpha release again.
          # To drop the mirror once the alpha installs have moved over: delete
          # this block, then `gh release delete alpha --cleanup-tag --yes`.
          if [ "$SELF_UPDATES" = yes ] && gh release view alpha --repo "$R" >/dev/null 2>&1; then
            gh release upload alpha --repo "$R" --clobber latest.json
          fi

  # Browser end-to-end checks for the imported-assembly Browser tree.
  #
  # Deliberately NON-GATING: nothing `needs:` this job, so a browser flake can
  # never block a beta publish. That matters here because a green build
  # auto-publishes to users who auto-update, and browser e2e is the classic
  # flaky surface.
  #
  # The engine is the one `rust-geom` built and tested, handed over as an
  # artifact rather than compiled again with OpenCASCADE here.
  #
  # These exist because everything else about the assembly tree is unit tests and
  # row counts. The render-signature bug (a document whose product NAMES changed
  # while its bodies did not never repainted the panel) passed every unit test and
  # was only caught by looking at the rendered panel.
  #
  # Uses the runner's PREINSTALLED Google Chrome rather than downloading a browser,
  # and installs playwright-core with --no-save so the main build path keeps its
  # dependency set unchanged.
  e2e:
    needs: rust-geom
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm ci
          npm i --no-save playwright-core@1.56.0

      - name: Fetch the engine rust-geom built
        uses: actions/download-artifact@v4
        with:
          name: fundacad-engine-linux
          path: engine-bin

      - name: Start the geometry engine and vite
        run: |
          chmod +x engine-bin/fundacad-engine
          FUNDACAD_ENGINE_PORT=8765 FUNDACAD_ENGINE_TOKEN=citoken \
            engine-bin/fundacad-engine --ws > /tmp/ci_engine.log 2>&1 &
          npx vite --port 5173 > /tmp/ci_vite.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "LISTENING 8765" /tmp/ci_engine.log 2>/dev/null && break
            sleep 2
          done
          grep -q "LISTENING 8765" /tmp/ci_engine.log || { echo "the engine never listened"; cat /tmp/ci_engine.log; exit 1; }

      # e2e/browser_tree_perf.cjs is deliberately NOT run here: it is a
      # benchmark whose verdict compares two medians, and a shared runner's
      # noise can invert that. Run it by hand (see its header).
      - name: Assembly tree end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/assembly_tree_e2e.cjs

      - name: History column end-to-end
        env:
          SC_TOKEN: citoken
          SC_CHROME: /usr/bin/google-chrome
        run: node e2e/history_side_e2e.cjs

      - name: Engine log on failure
        if: failure()
        run: tail -50 /tmp/ci_engine.log /tmp/ci_vite.log || true

  # The geometry engine (crates/, docs/ENGINE.md) and the app shell around
  # it. It compiles OpenCASCADE 7.8.1 from source through the occt-sys crate,
  # which is long on a cold runner and short once target/OCCT is cached, so the
  # static kernel gets its own cache keyed on the crate that builds it. It gates
  # the beta build: red here means the engine is broken.
  rust-geom:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # src-tauri links the tauri crate, which needs the webkit2gtk stack and
      # libudev; cmake builds OpenCASCADE.
      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Install cmake
        run: sudo apt-get install -y cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      # The same kernel and key as build-beta's, so the two jobs share it. Keep
      # it after rust-cache, see build-beta.
      - name: Cache the static OpenCASCADE build
        uses: actions/cache@v4
        with:
          path: |
            target/OCCT
            !target/OCCT/build
          key: occt-static-${{ runner.os }}-${{ hashFiles('third_party/opencascade-rs/crates/occt-sys/src/lib.rs', 'third_party/opencascade-rs/crates/opencascade-sys/build.rs', 'third_party/opencascade-rs/crates/opencascade-sys/Cargo.toml') }}

      # The whole workspace, not the kernel crate alone: the engine's request
      # loop, its transports and the protocol have tests of their own, and the
      # WebSocket transport is behind a feature, so without it the server the
      # browser and the e2e scripts talk to is never compiled here. It also
      # covers fundacad-mcp, whose suites drive the built
      # binaries rather than the library: the MCP server over its real stdio
      # protocol, and `fundacad-engine` over a real socket for the live session.
      # The plugin host suites load each plugin's built component and skip
      # without it, and the MCP suites drive the built engine binary, so both
      # are built first or those tests pass without testing anything.
      - name: Build the plugin components
        run: python3 scripts/build-plugin-wasm.py

      - name: Build the workspace binaries
        run: cargo build --workspace --features fundacad-engine/ws

      - name: Rust workspace tests
        run: cargo test --workspace --features fundacad-engine/ws

      # Text outlines come from the system's fonts, and the text goldens were
      # frozen with Windows' Arial and Times New Roman. A case whose font is
      # not installed is skipped rather than compared with a stand in.
      - name: Install the fonts the text goldens were frozen with
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer

      # Parity with the retired sidecar: every corpus rebuilt on this
      # engine and compared with the sidecar's frozen answers in
      # tests/golden (docs/ENGINE.md, "Golden files"). The MCP transcript is
      # crates/fundacad-mcp/tests/parity_golden.rs, run by the step above. Every
      # golden runs even after one fails, so a red build names them all.
      - name: Golden parity checks
        shell: bash
        run: |
          fail=0
          for g in tests/golden/*.golden.json; do
            case "$g" in *mcp_parity*) continue ;; esac
            # The engine's progress lines go to stderr; kept for a failure only.
            ./target/debug/fundacad-engine golden-check "$g" 2>golden.err \
              || { echo "::error::$g does not match its golden answers"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # The same answers from a warm disk cache: a first process checkpoints
      # every build, a second reopens every document from those checkpoints, as
      # the app does after a restart. The goldens whose documents run plugin
      # features, where state that is not in the shape has to survive the disk.
      - name: Golden parity checks, warm cache
        shell: bash
        run: |
          fail=0
          for g in texture plugins screws_ops; do
            ./target/debug/fundacad-engine golden-check "tests/golden/$g.golden.json" --warm 2>golden.err \
              || { echo "::error::$g does not match its golden answers from a warm cache"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # The app shell, including tests/container_seam.rs: an import the engine
      # stored survives the app's container into a fresh blob store and
      # rebuilds there. Links the kernel this job already built, and a `dist`
      # stands in for the frontend, which the Tauri context embeds.
      - name: App shell tests (unit + container seam)
        working-directory: src-tauri
        run: |
          mkdir -p ../dist
          cargo test --tests

      - name: Upload the engine for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: fundacad-engine-linux
          retention-days: 1
          if-no-files-found: error
          path: target/debug/fundacad-engine

      # The shipped engine is an optimised GCC build, which the debug build above
      # is not: undefined behaviour in the C++ shims has shown up only there. The
      # same goldens again on a release build, each under a clock, so a result
      # that differs or a rebuild that hangs only once optimised fails here. A
      # release build finds plugins only through FUNDACAD_PLUGIN_DIR.
      - name: Build the release engine
        run: cargo build --release -p fundacad-cli

      - name: Golden parity checks, release build
        shell: bash
        env:
          FUNDACAD_PLUGIN_DIR: plugins
        run: |
          fail=0
          for g in tests/golden/*.golden.json; do
            case "$g" in *mcp_parity*) continue ;; esac
            code=0
            timeout 900 ./target/release/fundacad-engine golden-check "$g" 2>golden.err || code=$?
            [ $code -eq 124 ] && echo "::error::$g did not finish in 15 minutes on the release build"
            [ $code -ne 0 ] && { echo "::error::$g fails on the release build"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail
