# CI for the Rust workspace: the geometry engine (docs/ENGINE.md), the document
# core and format, the protocol, the CLI and the MCP server. The Tauri app and its
# installers are gone, so this workflow publishes nothing.
#
# No SYSTEM OpenCASCADE anywhere: the occt-sys crate carries the 7.8.1 sources and
# builds them statically into the binary.
#
# A push whose Rust inputs match a green run reuses that run's engine and skips
# rust-geom's builds and tests, see rust-key. A manual run (Run workflow) always
# builds everything.

name: build

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "manual/**"
  pull_request:
    paths-ignore:
      - "manual/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap checks on Linux before anything is built.
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Cheapest gate first: refuse agent/editor session artifacts and hardcoded
      # developer paths before spending 18 minutes on installers. This is a public
      # repo, .claude/settings.json and a home-directory layout both reached it
      # once already, and .gitignore can't catch an already-tracked path.
      - name: Repo hygiene
        run: sh scripts/check-repo-hygiene.sh

      - name: Secret scan (gitleaks)
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" dir . --config .gitleaks.toml --redact --no-banner

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt

      # Never cargo fmt --all: it follows path dependencies into third_party and
      # rewrites vendored code. Each plugin's geometry-rs is its own workspace,
      # and build_identity.rs is include!d by two build.rs files, so plain cargo
      # fmt never reaches it.
      - name: Code is formatted (rustfmt)
        run: |
          cargo fmt --check
          for p in Organic PrintToolbox Printing Screws Texture; do (cd plugins/FundaCAD.$p/geometry-rs && cargo fmt --check) || exit 1; done
          rustfmt --edition 2021 --check crates/fundacad-engine/build_identity.rs

      # The disk keeping rust-geom does on the self hosted runner, against a fake checkout.
      - name: Warm target dir tests
        run: python3 tests/build/test_warm_target.py

      # The manual's capture tool: its manifests against the pages, its GIF encoder and its retries. It needs
      # tomllib, which the runner's Python 3.10 lacks, so this comes last in the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Capture tool tests
        run: python tests/manual/test_capture.py

      - name: Manual list tests
        run: python tests/manual/test_lists.py

      - name: Manual glossary tests
        run: python tests/manual/test_glossary.py

      - name: Manual keyboard page tests
        run: python tests/manual/test_keyboard_page.py

      - name: Manual version build tests
        run: python tests/manual/test_versions.py

      - name: Manual axe walk tests
        run: python tests/manual/test_axe_site.py

  rust-key:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.look.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Key the Rust inputs
        id: key
        shell: bash
        run: |
          # Harness files the Rust tests read all the same.
          read='tools/harness/fixtures'
          sum=$( {
            git ls-tree -r HEAD | grep -v -E $'\t(\\.github/workflows|docs|crates/fundacad-app|third_party/gpui|manual|tools/harness|tests/build|tests/manual)/|\tplugins/[^/]+/locales/|\\.md$'
            git ls-tree -r HEAD -- $read
            # Of the workflows, only these two jobs build and test Rust.
            awk '/^  [a-z][a-z0-9-]*:\r?$/ { on = $1 ~ /^rust-(key|geom):/ } on' .github/workflows/build.yml
          } | sha256sum | cut -c1-40)
          echo "key=rust-geom-green-v1-$(date -u +%G-W%V)-$sum" >> "$GITHUB_OUTPUT"

      - name: Look for a green rust-geom of the same inputs
        id: look
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust-geom-green
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

  # The geometry engine (crates/, docs/ENGINE.md). It compiles OpenCASCADE
  # 7.8.1 from source through the occt-sys crate, which is long on a cold runner
  # and short once target/OCCT is cached, so the static kernel gets its own cache
  # keyed on the crate that builds it. Red here means the engine is broken.
  rust-geom:
    # The self hosted runner keeps its target dir between runs, so only what
    # changed recompiles. Only the owner's own pushes and manual runs go there,
    # everyone else gets GitHub's runner; the runner's job-started hook refuses
    # anything else too, since a fork pull request could edit this file.
    # vars.FAST_RUNNER off falls back to GitHub. When rust-key found a green run
    # of the same Rust inputs, this job only hands that run's engine on, from
    # GitHub's runner, so a docs change never waits for the self hosted one.
    needs: rust-key
    runs-on: ${{ needs.rust-key.outputs.hit == 'true' && 'ubuntu-22.04' || ((github.event_name != 'pull_request' && github.actor == 'Paraxdev' && github.triggering_actor == 'Paraxdev' && vars.FAST_RUNNER == 'true') && fromJSON('["self-hosted","fundacad"]') || 'ubuntu-22.04') }}
    timeout-minutes: 240
    permissions:
      contents: read
    # Every test binary links the static OpenCASCADE, so full debug info filled
    # the runner's disk once the import suites grew. Line tables keep file:line
    # in panics.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      SELF_HOSTED: ${{ needs.rust-key.outputs.hit != 'true' && github.event_name != 'pull_request' && github.actor == 'Paraxdev' && github.triggering_actor == 'Paraxdev' && vars.FAST_RUNNER == 'true' }}
      GREEN: ${{ needs.rust-key.outputs.hit == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A clean checkout would delete the warm target dir.
          clean: ${{ env.SELF_HOSTED != 'true' }}
          persist-credentials: false

      - name: Free disk space
        if: env.SELF_HOSTED != 'true' && env.GREEN != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # cmake builds OpenCASCADE.
      - name: Install Linux system dependencies
        if: env.GREEN != 'true'
        uses: ./.github/actions/linux-deps

      - name: Install cmake
        if: env.GREEN != 'true'
        run: sudo apt-get install -y cmake

      - name: Install Rust
        if: env.GREEN != 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-wasip2

      - name: Cache Cargo
        if: env.SELF_HOSTED != 'true' && env.GREEN != 'true'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref_type != 'tag' }}

      # Kept after rust-cache, which would otherwise restore over it.
      - name: Cache the static OpenCASCADE build
        if: env.SELF_HOSTED != 'true' && env.GREEN != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/OCCT
            !target/OCCT/build
          key: occt-static-v2-${{ runner.os }}-${{ hashFiles('third_party/opencascade-rs/crates/occt-sys/src/lib.rs', 'third_party/opencascade-rs/crates/opencascade-sys/build.rs', 'third_party/opencascade-rs/crates/opencascade-sys/Cargo.toml') }}

      # A new stable rebuilds every unit beside the old toolchain's, which the
      # week long prune keeps: cargo 1.100's new layout took the runner's disk
      # from 55G to 11G free in four days. The runner's own logs share that
      # disk, so a full one fails the next job before its first step.
      - name: Start the warm target dir over on a new toolchain
        if: env.SELF_HOSTED == 'true' && env.GREEN != 'true'
        run: sh scripts/warm-target.sh toolchain

      - name: Keep room on the warm disk
        if: env.SELF_HOSTED == 'true' && env.GREEN != 'true'
        run: sh scripts/warm-target.sh floor 30

      # The whole workspace, not the kernel crate alone: the engine's request
      # loop, its transports and the protocol have tests of their own, and the
      # WebSocket transport is behind a feature, so without it the server is
      # never compiled here. It also
      # covers fundacad-mcp, whose suites drive the built
      # binaries rather than the library: the MCP server over its real stdio
      # protocol, and `fundacad-engine` over a real socket for the live session.
      # The plugin host suites load each plugin's built component and skip
      # without it, and the MCP suites drive the built engine binary, so both
      # are built first or those tests pass without testing anything.
      - name: Build the plugin components
        if: env.GREEN != 'true'
        run: python3 scripts/build-plugin-wasm.py

      - name: Build the workspace binaries
        if: env.GREEN != 'true'
        run: cargo build --locked --workspace --features fundacad-engine/ws

      - name: Rust workspace tests
        if: env.GREEN != 'true'
        run: cargo test --locked --workspace --features fundacad-engine/ws

      # Text outlines come from the system's fonts, and the text goldens were
      # frozen with Windows' Arial and Times New Roman. A case whose font is
      # not installed is skipped rather than compared with a stand in.
      - name: Install the fonts the text goldens were frozen with
        if: env.GREEN != 'true'
        run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer

      # Parity with the retired sidecar: every corpus rebuilt on this
      # engine and compared with the sidecar's frozen answers in
      # tests/golden (docs/ENGINE.md, "Golden files"). The MCP transcript is
      # crates/fundacad-mcp/tests/parity_golden.rs, run by the step above. Every
      # golden runs even after one fails, so a red build names them all.
      - name: Golden parity checks
        if: env.GREEN != 'true'
        shell: bash
        run: |
          fail=0
          for g in tests/golden/*.golden.json; do
            case "$g" in *mcp_parity*) continue ;; esac
            # The engine's progress lines go to stderr; kept for a failure only.
            ./target/debug/fundacad-engine golden-check "$g" 2>golden.err \
              || { echo "::error::$g does not match its golden answers"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # The same answers from a warm disk cache: a first process checkpoints
      # every build, a second reopens every document from those checkpoints, as
      # the app does after a restart. The goldens whose documents run plugin
      # features, where state that is not in the shape has to survive the disk.
      - name: Golden parity checks, warm cache
        if: env.GREEN != 'true'
        shell: bash
        run: |
          fail=0
          for g in texture plugins screws_ops; do
            ./target/debug/fundacad-engine golden-check "tests/golden/$g.golden.json" --warm 2>golden.err \
              || { echo "::error::$g does not match its golden answers from a warm cache"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # The shipped engine is an optimised GCC build, which the debug build above
      # is not: undefined behaviour in the C++ shims has shown up only there. The
      # same goldens again on a release build, each under a clock, so a result
      # that differs or a rebuild that hangs only once optimised fails here. A
      # release build finds plugins only through FUNDACAD_PLUGIN_DIR.
      # Tier 2 at most, since the steps after it still need the debug engine.
      - name: Keep room for the release build
        if: env.SELF_HOSTED == 'true' && env.GREEN != 'true'
        run: sh scripts/warm-target.sh floor 15 2

      - name: Build the release engine
        if: env.GREEN != 'true'
        run: cargo build --locked --release -p fundacad-cli

      - name: Golden parity checks, release build
        if: env.GREEN != 'true'
        shell: bash
        env:
          FUNDACAD_PLUGIN_DIR: plugins
        run: |
          fail=0
          for g in tests/golden/*.golden.json; do
            case "$g" in *mcp_parity*) continue ;; esac
            code=0
            timeout 900 ./target/release/fundacad-engine golden-check "$g" 2>golden.err || code=$?
            [ $code -eq 124 ] && echo "::error::$g did not finish in 15 minutes on the release build"
            [ $code -ne 0 ] && { echo "::error::$g fails on the release build"; tail -n 20 golden.err; fail=1; }
          done
          exit $fail

      # Saved last, so only inputs that passed every step above are skipped later.
      - name: Remember this green run's engine
        if: env.GREEN != 'true'
        run: |
          mkdir -p rust-geom-green
          cp target/debug/fundacad-engine rust-geom-green/

      - name: Save the green run for the same inputs
        if: env.GREEN != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust-geom-green
          key: ${{ needs.rust-key.outputs.key }}

      # The warm target dir gains a test binary per change; a week is kept.
      - name: Prune the warm target dir
        if: always() && env.SELF_HOSTED == 'true'
        run: sh scripts/warm-target.sh prune 7
