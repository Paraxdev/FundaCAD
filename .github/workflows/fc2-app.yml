# FundaCAD 2, the native app in crates/fundacad-app. It is its own Cargo
# workspace, so the GPUI fork and its system libraries stay out of the engine
# jobs in build.yml, and it runs only when a Rust crate it builds on changes.

name: fc2-app

on:
  push:
    branches: [main, dev]
    paths:
      - "crates/**"
      - "third_party/gpui/**"
      - ".github/workflows/fc2-app.yml"
  pull_request:
    paths:
      - "crates/**"
      - "third_party/gpui/**"
      - ".github/workflows/fc2-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fc2-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-fc2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci-apt-update.sh -qq
          sudo timeout -k 10 900 apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxi-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Cargo
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/fundacad-app -> ../../target-fc2
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Format
        shell: bash
        run: cargo fmt --check --manifest-path crates/fundacad-app/Cargo.toml

      - name: Build
        shell: bash
        run: cargo build --locked --manifest-path crates/fundacad-app/Cargo.toml

      - name: Tests
        shell: bash
        run: cargo test --locked --manifest-path crates/fundacad-app/Cargo.toml
