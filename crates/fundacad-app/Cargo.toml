[package]
name = "fundacad-app"
version = "2.0.0-indev.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["Paraxdev"]
rust-version = "1.89"
publish = false
description = "FundaCAD 2, the native app on GPUI"

# Its own workspace: see the root Cargo.toml.
[workspace]

[[bin]]
name = "fundacad-app"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.11.0"
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.14" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
log = "0.4"
async-channel = "2"
fundacad-client = { path = "../fundacad-client" }
fundacad-core = { path = "../fundacad-core" }
fundacad-format = { path = "../fundacad-format" }
serde = { version = "1", features = ["derive"] }
dirs = "6"
rfd = "0.17"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rust-embed = "8.14"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14", features = ["test-support"] }

[features]
# FUNDA_SHOT=<file.png> saves the window as GPUI rendered it, then quits.
shot = ["dep:image", "gpui/test-support", "gpui_windows/test-support"]

[target.'cfg(windows)'.dependencies]
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.14" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
gpui-pre = { path = "../../third_party/gpui/gpui-pre" }
gpui-pre-wgpu = { path = "../../third_party/gpui/gpui-pre-wgpu" }
gpui-pre-windows = { path = "../../third_party/gpui/gpui-pre-windows" }
