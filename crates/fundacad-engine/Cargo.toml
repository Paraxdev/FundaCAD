[package]
name = "fundacad-engine"
description = "FundaCAD engine worker: request loop, job serialisation, cancel, progress and transports"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
fundacad-protocol = { path = "../fundacad-protocol" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
libc = "0.2"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tungstenite = { version = "0.29", optional = true, default-features = false, features = ["handshake"] }
getrandom = { version = "0.3", optional = true, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[[test]]
name = "stdio_worker"
harness = false

[features]
# The WebSocket transport, for browser dev, e2e and the Python protocol suites.
# The app talks to its worker over stdio and leaves it off.
ws = ["dep:tungstenite", "dep:getrandom"]

[dev-dependencies]
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
