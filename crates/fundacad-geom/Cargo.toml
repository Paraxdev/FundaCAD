[package]
name = "fundacad-geom"
description = "FundaCAD geometry engine: the CAD document rebuilt on OpenCASCADE, in Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# Vendored bindings (third_party/opencascade-rs). The default `builtin` feature
# pulls occt-sys from crates.io, which carries the OpenCASCADE 7.8.1 sources and
# builds them statically with cmake: no system OpenCASCADE on any platform.
opencascade = { path = "../../third_party/opencascade-rs/crates/opencascade" }
opencascade-sys = { path = "../../third_party/opencascade-rs/crates/opencascade-sys" }
blake2 = "0.10"
cxx = "1"
fundacad-core = { path = "../fundacad-core" }
fundacad-engine = { path = "../fundacad-engine" }
indexmap = { version = "2", features = ["serde"] }
fundacad-protocol = { path = "../fundacad-protocol" }
glam = { version = "0.24", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# deflate-flate2 selects no backend, flate2 is named for its default rust_backend
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
quick-xml = "0.37"
fontdb = "0.24.0"
ttf-parser = "0.25.1"
