[package]
name = "fundacad-format"
description = "FundaCAD document files: the binary .fundab, the ZIP container and the JSON .funda"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# The app has always read documents with preserve_order on, so a document's keys
# come back in the order they were written.
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
blake2 = "0.10"
getrandom = "0.2"
# deflate-flate2 selects no backend, flate2 is named for its default rust_backend
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
reed-solomon-erasure = "6"
crc32fast = "1"
ciborium = "0.2"
