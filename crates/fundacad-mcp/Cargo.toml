[package]
name = "fundacad-mcp"
description = "FundaCAD over MCP: the tools another model uses to build, measure and look at a part"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "fundacad-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "time", "sync", "fs"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
fundacad-core = { path = "../fundacad-core" }
fundacad-protocol = { path = "../fundacad-protocol" }
base64 = "0.22"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
png = "0.17"
blake2 = "0.10"
getrandom = { version = "0.3", features = ["std"] }

[dev-dependencies]
blake2 = "0.10"
flate2 = "1"
tempfile = "3"
tokio-tungstenite = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
