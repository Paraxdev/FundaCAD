<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neocad</title>
    <!-- Without this the browser asks for /favicon.ico on every load and logs a
         404, which is noise that hides real errors in a console anyone is
         actually reading. Vite rewrites the href for the build. -->
    <link rel="icon" type="image/svg+xml" href="/assets/brand/neocad-mark.svg" />
  </head>
  <body>
    <!-- The shell used to be written out here as static markup. It now lives in
         src/App.vue; Vue mounts into this node. Keep it EMPTY — Vue treats a
         mount container's existing innerHTML as a template when the root
         component has no render function, which is both a footgun and a thing
         the webview CSP (no 'unsafe-eval') could not compile anyway. -->
    <div id="app"></div>
    <!-- Before main.ts on purpose: boot.ts reports to Rust that the page
         loaded, and must not be able to fail because main.ts did. Vue is
         imported only by main.ts, so this separation still means what its
         comment says it means. -->
    <script type="module" src="/src/boot.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
