<svg width="640" height="124" viewBox="0 36 640 124" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Neocad">
  <!-- Mark: an isometric solid, three faces shaded from one light direction.
       Built from the app's own accent (#4ca5e0, styles/_tokens.scss) rather
       than a separate brand palette, so the window chrome and the logo cannot
       drift apart. -->
  <g>
    <!-- right face (in shadow) -->
    <path d="M72 98 L108.4 77 L108.4 119 L72 140 Z" fill="#1f4f70"/>
    <!-- left face (mid) -->
    <path d="M72 98 L35.6 77 L35.6 119 L72 140 Z" fill="#2d76a4"/>
    <!-- top face (lit) -->
    <path d="M72 56 L108.4 77 L72 98 L35.6 77 Z" fill="#4ca5e0"/>
    <!-- silhouette + the one interior edge, so it reads as a solid at 16px -->
    <path d="M72 56 L108.4 77 L108.4 119 L72 140 L35.6 119 L35.6 77 Z"
          fill="none" stroke="#9fccea" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M35.6 77 L72 98 L108.4 77 M72 98 L72 140"
          fill="none" stroke="#9fccea" stroke-width="2" stroke-linejoin="round" opacity="0.55"/>
  </g>

  <!-- wordmark: convert to outlines before shipping so it renders identically everywhere -->
  <text x="176" y="112" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#E9EFF6">Neo</tspan><tspan fill="#4ca5e0">cad</tspan>
  </text>
</svg>
