[package]
name = "printing-geometry"
description = "The printer connection's slicer project export, as a FundaCAD plugin component"
version = "2.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Its own workspace: a plugin builds for wasm32-wasip2, never with the engine.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.46"
serde_json = { version = "1", features = ["preserve_order"] }
miniz_oxide = "0.8"
crc32fast = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
